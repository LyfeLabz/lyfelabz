name: Platform CI

on:
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'
      # U1B unit-placement parity inputs: the RA-1 projection, the
      # curriculum registry and generated manifest it reads, and the gate.
      - 'app/src/curriculum/**'
      - 'app/scripts/build-curriculum-manifest.cjs'
      - 'app/scripts/curriculumRegistry.cjs'
      - 'app/scripts/curriculumCatalog.cjs'
      - 'app/scripts/curriculumParser.cjs'
      - 'app/scripts/activityIdentifiers.cjs'
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'index.html'
      - 'scripts/unit-placement/**'
      # A3-6 S4 provider observer, S5 access review and the A1 helpers they reuse.
      - 'scripts/teacher-units-release/**'
      - 'scripts/hosting-release/backend-state.cjs'
      - 'scripts/hosting-release/contract.cjs'
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'
      # U1B unit-placement parity inputs: the RA-1 projection, the
      # curriculum registry and generated manifest it reads, and the gate.
      - 'app/src/curriculum/**'
      - 'app/scripts/build-curriculum-manifest.cjs'
      - 'app/scripts/curriculumRegistry.cjs'
      - 'app/scripts/curriculumCatalog.cjs'
      - 'app/scripts/curriculumParser.cjs'
      - 'app/scripts/activityIdentifiers.cjs'
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'index.html'
      - 'scripts/unit-placement/**'
      # A3-6 S4 provider observer, S5 access review and the A1 helpers they reuse.
      - 'scripts/teacher-units-release/**'
      - 'scripts/hosting-release/backend-state.cjs'
      - 'scripts/hosting-release/contract.cjs'

jobs:
  functions:
    name: Functions (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/functions
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the ASTRA-004 hosting suite verifies against an
          # approved base commit via `git ls-tree`, which a shallow clone
          # does not contain.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            platform/functions/package-lock.json
            app/package-lock.json
      - name: Install dependencies
        run: npm ci
      # The operator CLIs (publish-variant, deploy-assessment-staging) and
      # their tests load the canonical app-owned lessonBuilder modules at run
      # time, and those resolve their dependencies (e.g. acorn) from
      # app/node_modules.
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      # U1B: required. The server teacher-unit placement list must equal
      # the RA-1 projection (fails closed). `npm run build` below also runs
      # it as `prebuild`; this step names it and runs the gate's own tests.
      - name: Unit placement parity
        run: |
          node ../../scripts/unit-placement/check-parity.cjs
          node --test ../../scripts/unit-placement/check-parity.test.cjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # A3-6 S4: provider observer over synthetic fixtures only. No
      # credentials and no provider calls. Uses the compiled lib from Build.
      - name: A3-6 S4 provider observer (fixtures)
        run: node --test ../../scripts/teacher-units-release/provider-observation.test.cjs
      # A3-6 S5: IAM and route review over synthetic fixtures only (level A).
      # No credentials and no provider calls.
      - name: A3-6 S5 access review (fixtures)
        run: node --test ../../scripts/teacher-units-release/access-review.test.cjs
      - name: A3-6 S6a operator tooling (offline fixtures)
        run: node --test ../../scripts/teacher-units-release/cli.test.cjs ../../scripts/teacher-units-release/freshness.test.cjs ../../scripts/teacher-units-release/statements.test.cjs
      # A3-6 S6b: offline, non-authorizing evidence assembly over synthetic fixtures only.
      # No credentials, no provider calls, no emulator.
      - name: A3-6 S6b evidence assembly (offline fixtures)
        run: node --test ../../scripts/teacher-units-release/evidence-package.test.cjs
      # A3-6 S6c: read-only provider capture and offline replay over synthetic exchanges only.
      # No credentials, no provider calls, no live capture.
      - name: A3-6 S6c provider capture (offline fixtures)
        run: node --test ../../scripts/teacher-units-release/provider-capture.test.cjs ../../scripts/teacher-units-release/surface-observation.test.cjs
      # A3-6 S6d: offline, non-authorizing revocation preparation and rollout comparison over
      # synthetic fixtures only. No credentials, no provider calls, no signing, no emulator.
      - name: A3-6 S6d revocation preparation (offline fixtures)
        run: node --test ../../scripts/teacher-units-release/revocation-procedure.test.cjs
      # A3-6 S6f: staging-only, non-authorizing discovery and offline replay over synthetic
      # exchanges only. No credentials, no provider calls, no live discovery.
      - name: A3-6 S6f staging discovery (offline fixtures)
        run: node --test ../../scripts/teacher-units-release/staging-discovery.test.cjs
      # S6a writers run only against the Firestore emulator for a demo- project, using the
      # same Java and pinned firebase-tools setup as the Rules job. No credentials.
      - name: Set up Java (Firestore emulator for A3-6 S6a)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Firebase emulator tooling
        working-directory: platform/firebase
        run: npm ci
      - name: A3-6 S6a emulator-only writers (Firestore emulator, demo project)
        run: ../firebase/node_modules/.bin/firebase emulators:exec --only firestore --project demo-a3-s6a --config ../firebase/firebase.json "node --test --test-concurrency=1 ../../scripts/teacher-units-release/registration.emulator.test.cjs ../../scripts/teacher-units-release/availability-cas.emulator.test.cjs"

  firestore-rules:
    name: Firestore Rules tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/firebase/package-lock.json
      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Run Firestore Rules tests
        run: npm run test:rules
