<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LyfeLabz Platform</title>
<!-- Sprint 20 (Visual Identity Refinement): load Orbitron so the
     Teacher Workspace can reuse the canonical LYFELABZ wordmark
     typography already used across the public LyfeLabz experience.
     No new font families are introduced elsewhere in the shell. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.5;
  }
  #app-root { text-align: center; padding: 1.5rem; max-width: 40rem; }
  h1 { font-size: 1.5rem; font-weight: 500; margin: 0 0 0.5rem 0; }
  p { margin: 0.25rem 0; }
  button { margin-top: 1rem; padding: 0.5rem 1rem; font: inherit; cursor: pointer; }
  [role="alert"] { color: #a00; }
</style>
<style id="shell-canonical">
  /* Teacher Platform Shell layout tokens. Reuses inherited typography;
     introduces no new design system. See SPRINT_3_STEP_5_SPECIFICATION.md. */
  #app-root:has(> .shell-header) {
    display: block;
    text-align: left;
    padding: 0;
    max-width: none;
    width: 100%;
    align-self: stretch;
  }
  body:has(#app-root > .shell-header) {
    display: block;
    align-items: initial;
    justify-content: initial;
  }
  .shell-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    /* Vertical padding mirrors the canonical public homepage nav
       (index.html .nav = padding: 0.85rem 2.5rem @ html font-size:18px,
       i.e. 15.3px block padding). No fixed height so header thickness
       is driven by wordmark line-box + padding, exactly like the
       public site. Horizontal padding preserves the workspace
       chrome's tighter left/right rhythm. */
    padding: 15.3px 1.25rem;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    background: #fff;
    box-sizing: border-box;
  }
  .shell-brand {
    margin: 0;
    flex: 0 0 auto;
  }
  .shell-header-identity {
    flex: 1 1 auto;
    text-align: right;
    font-size: 0.95rem;
    color: #444;
    min-width: 0;
  }
  .shell-header-name {
    display: inline-block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: bottom;
  }
  .shell-notifications {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    color: #b8b8b8;
    font-size: 1.15rem;
    line-height: 1;
    flex: 0 0 auto;
    user-select: none;
  }
  .shell-signout {
    margin: 0;
    padding: 0.4rem 0.9rem;
    background: transparent;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
    flex: 0 0 auto;
    min-height: 36px;
  }
  .shell-signout:hover, .shell-signout:focus-visible {
    border-color: #666;
  }
  .shell-body {
    display: grid;
    grid-template-columns: 224px 1fr;
    max-width: 1760px;
    margin: 0 auto;
    padding: 1.25rem 1.5rem 1.25rem 1rem;
    gap: 2.75rem;
    box-sizing: border-box;
  }
  @media (min-width: 1280px) {
    .shell-body {
      padding-left: 1.25rem;
      padding-right: 2.25rem;
      gap: 3.25rem;
    }
  }
  @media (min-width: 1600px) {
    .shell-body {
      padding-left: 1.5rem;
      padding-right: 2.5rem;
      gap: 3.75rem;
    }
  }
  .shell-nav-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .shell-nav-button {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    width: 100%;
    text-align: left;
    padding: 0.55rem 0.75rem;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    font: inherit;
    margin: 0;
    min-height: 40px;
    box-sizing: border-box;
  }
  .shell-nav-brand {
    display: block;
  }
  .shell-nav-active {
    background: #f4f4f4;
    font-weight: 600;
    cursor: default;
  }
  .shell-nav-brand {
    font-weight: 700;
    letter-spacing: 0.06em;
    color: #222;
    padding-top: 1.1rem;
    padding-bottom: 1.1rem;
    margin-bottom: 0.75rem;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 0;
    background: transparent;
  }
  .shell-nav-icon {
    flex: 0 0 auto;
    display: inline-block;
    vertical-align: middle;
    opacity: 0.85;
  }
  .shell-nav-label {
    display: inline-block;
    vertical-align: middle;
  }
  .shell-nav-brand.shell-nav-active {
    background: transparent;
  }
  .shell-nav-disabled {
    color: #8a8a8a;
    cursor: not-allowed;
  }
  .shell-nav-disabled:hover, .shell-nav-disabled:focus { color: #8a8a8a; }
  .shell-main {
    display: block;
    min-width: 0;
  }
  .shell-welcome {
    font-size: 1.5rem;
    font-weight: 500;
    margin: 0 0 0.5rem 0;
    outline: none;
  }
  .shell-welcome:focus-visible { outline: 2px solid #444; outline-offset: 2px; }
  .shell-status {
    color: #555;
    margin: 0 0 1.25rem 0;
  }
  .shell-card {
    background: #fff;
    border: 1px solid rgba(0, 0, 0, 0.09);
    border-radius: 6px;
    padding: 1rem 1.15rem;
    margin: 0 0 1rem 0;
  }
  .shell-identity-list {
    display: grid;
    grid-template-columns: minmax(120px, auto) 1fr;
    gap: 0.35rem 1rem;
    margin: 0;
  }
  .shell-identity-row {
    display: contents;
  }
  .shell-identity-row dt {
    font-weight: 600;
    color: #333;
    margin: 0;
  }
  .shell-identity-row dd {
    margin: 0;
    color: #222;
    word-break: break-word;
  }
  .shell-pill {
    display: inline-block;
    padding: 0.1rem 0.55rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .shell-pill-verified {
    background: rgba(207, 168, 60, 0.18);
    color: #8a6d15;
    border: 1px solid rgba(138, 109, 21, 0.25);
  }
  .shell-placeholder-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin: 0.5rem 0 1.5rem 0;
  }
  .shell-placeholder-card {
    background: #fafafa;
    color: #666;
    cursor: not-allowed;
  }
  .shell-placeholder-card:hover, .shell-placeholder-card:focus { background: #fafafa; }
  .shell-placeholder-title {
    font-size: 1rem;
    margin: 0 0 0.35rem 0;
    color: #333;
  }
  .shell-placeholder-purpose { margin: 0 0 0.5rem 0; }
  .shell-placeholder-status { margin: 0; font-size: 0.9rem; }
  .shell-return-link {
    display: inline-block;
    margin-top: 0.75rem;
    font-size: 0.9rem;
    color: #555;
  }
  /* Curriculum landing (Sprint 6D). Reuses the shell card language and
     introduces teacher-only activation controls. Placeholder-only:
     activation state is client-local per mount. */
  .shell-curriculum-intro {
    max-width: 46rem;
  }
  .shell-curriculum-controls {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin: 0 0 1rem 0;
  }
  .shell-filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }
  .shell-filter-pill {
    padding: 0.35rem 0.75rem;
    background: #fff;
    border: 1px solid rgba(0, 0, 0, 0.15);
    border-radius: 999px;
    font: inherit;
    font-size: 0.9rem;
    color: #333;
    cursor: pointer;
    min-height: 32px;
  }
  .shell-filter-pill:hover, .shell-filter-pill:focus-visible {
    border-color: #666;
  }
  .shell-filter-pill-active {
    background: #eef1f5;
    border-color: #666;
    font-weight: 600;
  }
  .shell-curriculum-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    /* Sprint 20 polish: horizontal gap preserved; vertical gap tightened
       (~35%) so the grid reads as one continuous curriculum library. */
    column-gap: 0.85rem;
    row-gap: 0.55rem;
    margin: 0.75rem 0 1.25rem 0;
    min-width: 0;
  }
  .shell-lesson-card {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    padding: 0.55rem 0.85rem 0.55rem 0.85rem;
    /* Sprint 20 polish: override the inherited .shell-card
       margin-bottom that stacked with the grid row-gap and inflated
       row spacing. Card height is now driven only by content + the
       grid's own row track. */
    margin: 0;
    transition: opacity 0.15s ease-in-out;
    box-sizing: border-box;
    min-width: 0;
    overflow: hidden;
    /* Sprint 20 UI polish, Curriculum uniform-height fix.
       Enforce a single deliberate card height across the entire grid,
       not just within a row. CSS Grid alone equalizes track heights
       per row; this min-height carries the same height across every
       row so the Curriculum reads as one uniform library. The value
       is the smallest comfortable height that fits the canonical
       card contents: header pills row + reserved two-line title
       region + action row, plus current internal spacing. */
    min-height: 8.75rem;
  }
  .shell-lesson-card[hidden] { display: none; }
  .shell-lesson-card-inactive {
    background: #f6f6f6;
    opacity: 0.72;
  }
  .shell-lesson-header {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    align-items: center;
  }
  .shell-lesson-badge {
    display: inline-block;
    padding: 0.1rem 0.55rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    line-height: 1.4;
    background: #eef1f5;
    color: #444;
    border: 1px solid rgba(0, 0, 0, 0.08);
  }
  .shell-lesson-topic-life-science       { background: rgba(61,220,132,0.14);  color: #1f6b3d; }
  .shell-lesson-topic-earth-space        { background: rgba(180,127,255,0.14); color: #5b3a99; }
  .shell-lesson-topic-physical-science   { background: rgba(255,112,67,0.14);  color: #a24218; }
  .shell-lesson-topic-tech-engineering   { background: rgba(245,200,66,0.18);  color: #7a5b0a; }
  .shell-lesson-title {
    font-size: 1.02rem;
    font-weight: 600;
    color: #222;
    margin: 0;
  }
  .shell-lesson-card-inactive .shell-lesson-title { color: #555; }
  .shell-lesson-title-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.35rem 0.6rem;
    min-width: 0;
    /* Sprint 20 final structural pass: widen the gap between the
       Grade / Topic metadata pills and the lesson title so the title
       reads as a distinct hierarchical level rather than an extension
       of the pill row. Delta from prior value is ~4px. */
    margin-top: 0.4rem;
  }
  .shell-lesson-title-row .shell-lesson-title {
    flex: 1 1 auto;
    min-width: 0;
    overflow-wrap: anywhere;
    /* Sprint 20 UI polish, Curriculum uniform-height fix.
       Reserve exactly two lines of title height on every card so a
       one-line title no longer collapses its grid row and a two-line
       title no longer stretches its neighbors. One-line titles remain
       top-aligned (no vertical centering) because the block simply
       fills its reserved space from the top. Titles that would exceed
       two lines are visually clamped; the full stored title stays in
       the DOM node and remains available to assistive tech via the
       element's own textContent / accessible name. Reserved height is
       expressed in em so it tracks the title's own line-height (1.3)
       regardless of the exact font-size chosen upstream. */
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    overflow: hidden;
    min-height: 2.6em;
  }
  .shell-lesson-actions {
    display: flex;
    flex-wrap: nowrap;
    justify-content: flex-start;
    align-items: center;
    gap: 0.5rem;
    /* Sprint 20 final structural pass: shift the action row downward
       so it is visually separated from the title without being pinned
       to the bottom edge. The card layout remains Metadata -> Title ->
       Action with balanced whitespace around the action. Delta from
       prior value is ~8px. */
    margin-top: 0.55rem;
    min-width: 0;
  }
  .shell-lesson-actions > * {
    min-width: 0;
    max-width: 100%;
  }
  /* View summaries always sits on the right of the status bar so the
     Assign / Assigned control on the left has a stable location. */
  .shell-lesson-actions .shell-lesson-view-summary {
    margin-left: auto;
  }
  .shell-lesson-toggle {
    padding: 0.25rem 0.6rem;
    background: #fff;
    border: 1px solid rgba(0, 0, 0, 0.18);
    border-radius: 999px;
    font: inherit;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    cursor: pointer;
    min-height: 28px;
  }
  .shell-lesson-toggle[hidden] { display: none; }
  .shell-lesson-toggle-active {
    background: rgba(61, 140, 89, 0.12);
    border-color: rgba(61, 140, 89, 0.45);
    color: #1f6b3d;
  }
  .shell-lesson-toggle-inactive {
    background: rgba(162, 66, 24, 0.10);
    border-color: rgba(162, 66, 24, 0.35);
    color: #a24218;
  }
  .shell-lesson-toggle:hover, .shell-lesson-toggle:focus-visible {
    border-color: #333;
  }
  .shell-curriculum-empty {
    color: #666;
    margin: 0.25rem 0 1rem 0;
  }
  @media (pointer: coarse) {
    .shell-filter-pill { min-height: 44px; }
    .shell-lesson-toggle { min-height: 32px; }
  }
  @media (max-width: 480px) {
    .shell-lesson-actions {
      flex-wrap: wrap;
      justify-content: stretch;
    }
    .shell-lesson-assign,
    .shell-lesson-view-summary {
      flex: 1 1 auto;
      text-align: center;
    }
  }
  .shell-footer {
    text-align: center;
    padding: 1rem;
    color: #888;
    font-size: 0.85rem;
    border-top: 1px solid rgba(0, 0, 0, 0.06);
    margin-top: 1.5rem;
  }
  @media (max-width: 960px) {
    .shell-placeholder-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 720px) {
    .shell-body { grid-template-columns: 1fr; padding: 1rem; gap: 1rem; }
    .shell-nav-list { flex-direction: row; overflow-x: auto; }
    .shell-nav-button { min-width: 140px; }
    .shell-placeholder-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) {
    /* Compact horizontal chrome on phones. Vertical padding + wordmark
       size are preserved at canonical values so the brand mark reads
       identically to the public homepage across every viewport. */
    .shell-header { padding: 15.3px 0.75rem; gap: 0.5rem; }
    .shell-header-identity { display: none; }
  }
  @media (pointer: coarse) {
    .shell-nav-button, .shell-signout { min-height: 44px; }
    .shell-notifications { width: 44px; height: 44px; }
  }
  @media (orientation: landscape) and (max-width: 950px) {
    .shell-body { padding-left: max(1rem, env(safe-area-inset-left)); padding-right: max(1rem, env(safe-area-inset-right)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .shell-main, .shell-card { transition: none !important; animation: none !important; }
  }
  /* Sprint 8C: Settings > Integrations surface. Reuses the shell card
     language; introduces no new design system. */
  .shell-settings-category-button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    /* Sprint 26 Phase 5: reset the base `button` top margin so the
       Connected Services category keeps the same vertical rhythm as the
       plain-paragraph categories. */
    margin-top: 0;
    padding: 0;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .shell-settings-category-button:hover .shell-settings-category-title,
  .shell-settings-category-button:focus-visible .shell-settings-category-title {
    text-decoration: underline;
  }
  .shell-settings-category-hint {
    margin: 0.35rem 0 0 0;
    font-size: 0.85rem;
    color: #555;
  }
  .shell-integrations {
    display: block;
  }
  .shell-integrations-back {
    background: transparent;
    border: none;
    color: #444;
    font: inherit;
    padding: 0.25rem 0;
    margin-bottom: 0.5rem;
    cursor: pointer;
  }
  .shell-integrations-back:hover,
  .shell-integrations-back:focus-visible { text-decoration: underline; }
  .shell-integrations-heading {
    font-size: 1.05rem;
    margin: 0;
    color: #222;
  }
  .shell-integrations-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .shell-integrations-row {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .shell-integrations-row-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  .shell-integrations-pill-inactive {
    background: #eef1f5;
    color: #555;
    border: 1px solid rgba(0, 0, 0, 0.08);
  }
  /* Sprint 26 Phase 4: "action needed" connection status. Calm amber, not
     an alarm, distinct from the verified (connected) and inactive pills. */
  .shell-integrations-pill-attention {
    background: rgba(214, 158, 46, 0.16);
    color: #8a5a12;
    border: 1px solid rgba(138, 90, 18, 0.28);
  }
  .shell-integrations-recovery {
    margin: 0.35rem 0 0.75rem 0;
  }
  .shell-integrations-actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .shell-integrations-error {
    color: #a24218;
    background: rgba(255, 112, 67, 0.08);
    border: 1px solid rgba(162, 66, 24, 0.25);
    border-radius: 4px;
    padding: 0.6rem 0.85rem;
    margin: 0 0 1rem 0;
  }
  .shell-integrations-info {
    color: #1f6b3d;
    background: rgba(61, 220, 132, 0.08);
    border: 1px solid rgba(61, 140, 89, 0.3);
    border-radius: 4px;
    padding: 0.6rem 0.85rem;
    margin: 0 0 1rem 0;
  }
  .shell-integrations-candidates {
    list-style: none;
    padding: 0;
    margin: 0.5rem 0 1rem 0;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .shell-integrations-candidate {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 0.9rem;
    background: #fafafa;
    border: 1px solid rgba(0, 0, 0, 0.09);
    border-radius: 4px;
    flex-wrap: wrap;
  }
  .shell-integrations-candidate-name { margin: 0; font-weight: 600; color: #222; }
  .shell-integrations-candidate-section { margin: 0.15rem 0 0 0; font-size: 0.85rem; color: #555; }
  .shell-integrations-candidate-controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .shell-integrations-select-label {
    font-size: 0.85rem;
    color: #444;
  }
  .shell-integrations-select {
    font: inherit;
    padding: 0.3rem 0.4rem;
    min-height: 32px;
    border: 1px solid rgba(0, 0, 0, 0.18);
    border-radius: 4px;
    background: #fff;
  }
  .shell-integrations-empty {
    color: #555;
    margin: 0.5rem 0 1rem 0;
  }
  @media (pointer: coarse) {
    .shell-integrations-back, .shell-integrations-select { min-height: 44px; }
  }
  /* Assign Experience (Sprint 6E, remediated Sprint 20).
     The Curriculum surface builds a modal overlay for the Assign action
     entirely in JS with the classes below. Without these rules the
     overlay renders as an unpositioned block at the end of <body>, so
     clicking Assign appears to do nothing. Canonical LyfeLabz shell
     tokens; no new design system. */
  .shell-lesson-assign {
    padding: 0.35rem 0.75rem;
    font: inherit;
    background: #1f6b3d;
    color: #fff;
    border: 1px solid #1f6b3d;
    border-radius: 4px;
    cursor: pointer;
    min-height: 36px;
  }
  .shell-lesson-assign:hover, .shell-lesson-assign:focus-visible {
    background: #175a31;
    border-color: #175a31;
  }
  .shell-lesson-assign-assigned {
    background: #fff;
    color: #1f6b3d;
  }
  .shell-lesson-assign-assigned:hover,
  .shell-lesson-assign-assigned:focus-visible {
    background: rgba(31, 107, 61, 0.08);
    color: #175a31;
  }
  .shell-lesson-view-summary {
    padding: 0.35rem 0.75rem;
    font: inherit;
    background: #fff;
    color: #333;
    border: 1px solid rgba(0, 0, 0, 0.18);
    border-radius: 4px;
    cursor: pointer;
    min-height: 36px;
  }
  .shell-lesson-view-summary:hover,
  .shell-lesson-view-summary:focus-visible {
    border-color: #333;
  }
  .shell-curriculum-success {
    background: rgba(61, 220, 132, 0.12);
    border: 1px solid rgba(61, 140, 89, 0.35);
    color: #175a31;
    border-radius: 4px;
    padding: 0.55rem 0.85rem;
    margin: 0.75rem 0;
  }
  .shell-assign-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 20, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    z-index: 1000;
    overflow-y: auto;
  }
  .shell-assign-dialog {
    background: #fff;
    border-radius: 6px;
    padding: 1rem 1.25rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
    width: 100%;
    max-width: 34rem;
    max-height: calc(100vh - 2rem);
    overflow-y: auto;
    box-sizing: border-box;
  }
  .shell-assign-title {
    font-size: 1.05rem;
    margin: 0 0 0.75rem 0;
    color: #222;
  }
  .shell-assign-body {

  /* Sprint 20 internal beta: Classes create-class + join-code panels.

  .shell-form {

  /* ------------------------------------------------------------------
     Sprint 20: Teacher Visual Identity Refinement.
     Layered on top of the canonical shell rules above. Introduces no
     new components, class names, copy, or interaction. Only design
     tokens (palette, elevation, rhythm) applied to existing selectors,
     so every certified workflow is preserved. Values are derived from
     the established LyfeLabz palette: the student experience keeps its
     brighter tones; the teacher surface reads as a calmer sibling.
     ------------------------------------------------------------------ */
  :root {
    /* Teacher-adjacent palette. Anchored to the same greens the
       student surface uses so buttons and success states remain
       instantly recognizable across both experiences. */
    --tw-ink:            #1c2733;
    --tw-ink-soft:       #3a4653;
    --tw-ink-muted:      #566472;
    --tw-hairline:       rgba(28, 39, 51, 0.09);
    --tw-hairline-soft:  rgba(28, 39, 51, 0.06);
    --tw-page:           #f5f4f0;   /* warm gray */
    --tw-surface:        #ffffff;
    --tw-surface-alt:    #faf9f6;
    --tw-nav-wash:       rgba(26, 95, 111, 0.08);
    --tw-nav-edge:       #1a5f6f;   /* deep muted teal */
    --tw-primary:        #1f6b3d;   /* preserved LyfeLabz green */
    --tw-primary-strong: #175a31;
    --tw-primary-wash:   rgba(31, 107, 61, 0.09);
    --tw-focus-ring:     0 0 0 3px rgba(26, 95, 111, 0.22);
    --tw-shadow-card:    0 1px 2px rgba(28, 39, 51, 0.04),
                         0 1px 3px rgba(28, 39, 51, 0.05);
    --tw-shadow-header:  0 1px 0 rgba(28, 39, 51, 0.06);
    --tw-shadow-elev:    0 10px 32px rgba(20, 32, 44, 0.20);
    --tw-radius-card:    10px;
    --tw-radius-control: 6px;
    --tw-radius-pill:    999px;
  }

  /* Page canvas: warm gray page, white content cards, calmer ink. */
  body {
    background: var(--tw-page);
    color: var(--tw-ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Header: subtle base shadow instead of a hard 1px border; refined
     brand hierarchy. Layout, height, and controls unchanged. */
  #app-root:has(> .shell-header) .shell-header {
    border-bottom: 1px solid var(--tw-hairline-soft);
    box-shadow: var(--tw-shadow-header);
    background: var(--tw-surface);
  }
  .shell-brand {
    color: var(--tw-ink);
    letter-spacing: -0.005em;
  }
  .shell-header-identity { color: var(--tw-ink-muted); }
  .shell-signout {
    border-color: var(--tw-hairline);
    border-radius: var(--tw-radius-control);
    color: var(--tw-ink-soft);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .shell-signout:hover,
  .shell-signout:focus-visible {
    border-color: var(--tw-nav-edge);
    background: var(--tw-nav-wash);
  }

  /* Navigation: preserve layout; refine active state to a calm teal
     wash with a leading edge, so the current surface reads at a
     glance without shouting. Nav brand keeps its role as the section
     anchor. */
  .shell-body { gap: 1.75rem; }
  .shell-nav-list { gap: 0.15rem; }
  .shell-nav-button {
    color: var(--tw-ink-soft);
    border-radius: var(--tw-radius-control);
    transition: background 0.15s ease, color 0.15s ease;
    position: relative;
  }
  .shell-nav-button:hover:not(.shell-nav-active):not(.shell-nav-disabled),
  .shell-nav-button:focus-visible:not(.shell-nav-active):not(.shell-nav-disabled) {
    background: rgba(28, 39, 51, 0.04);
    color: var(--tw-ink);
  }
  .shell-nav-active {
    background: var(--tw-nav-wash);
    color: var(--tw-nav-edge);
  }
  .shell-nav-active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 20%;
    bottom: 20%;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--tw-nav-edge);
  }
  .shell-nav-brand {
    color: var(--tw-ink);
    letter-spacing: 0.08em;
    border-bottom-color: var(--tw-hairline-soft);
  }
  .shell-nav-brand.shell-nav-active { color: var(--tw-ink); }
  .shell-nav-brand.shell-nav-active::before { content: none; }

  /* Cards: softer hairline, gentle elevation, more breathing room.
     Structure, padding-baseline, and content unchanged. */
  .shell-card {
    border-color: var(--tw-hairline);
    border-radius: var(--tw-radius-card);
    box-shadow: var(--tw-shadow-card);
    padding: 1.15rem 1.25rem;
  }

  /* Dashboard hierarchy: the welcome headline anchors the space with
     a slightly larger, calmer weight. Reads immediately as "you are
     here" without changing structure. */
  .shell-welcome {
    font-size: 1.7rem;
    font-weight: 600;
    color: var(--tw-ink);
    letter-spacing: -0.012em;
    line-height: 1.25;
    margin: 0 0 0.4rem 0;
  }
  .shell-welcome:focus-visible {
    outline-color: var(--tw-nav-edge);
  }
  .shell-status { color: var(--tw-ink-muted); }

  /* Filter chips: softer body, teal-tinted active state to echo the
     nav language. */
  .shell-filter-pill {
    border-color: var(--tw-hairline);
    color: var(--tw-ink-soft);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .shell-filter-pill:hover,
  .shell-filter-pill:focus-visible { border-color: var(--tw-nav-edge); }
  .shell-filter-pill-active {
    background: var(--tw-nav-wash);
    border-color: var(--tw-nav-edge);
    color: var(--tw-nav-edge);
  }

  /* Lesson cards on Curriculum: same hairline + elevation contract as
     the primary shell card. Preserves color-coded topic badges. */
  .shell-lesson-card {
    background: var(--tw-surface);
    border-color: var(--tw-hairline);
    border-radius: var(--tw-radius-card);
    box-shadow: var(--tw-shadow-card);
  }
  .shell-lesson-card-inactive {
    background: var(--tw-surface-alt);
    box-shadow: none;
  }
  .shell-lesson-title { color: var(--tw-ink); }

  /* Primary action: keep the LyfeLabz green identity (buttons must
     stay instantly recognizable across student + teacher), but with
     a slightly larger radius, matched focus ring, and micro shadow
     that makes it feel intentional rather than raw. */
  .shell-lesson-assign,
  .shell-assign-confirm,
  .shell-classes-create-open,
  .shell-classes-create-actions button[type="submit"] {
    border-radius: var(--tw-radius-control);
    box-shadow: 0 1px 2px rgba(23, 90, 49, 0.18);
    transition: background 0.15s ease, border-color 0.15s ease,
                box-shadow 0.15s ease;
  }
  .shell-lesson-view-summary,
  .shell-assign-cancel,
  .shell-summary-select-choice,
  .shell-classes-create-cancel {
    border-radius: var(--tw-radius-control);
    border-color: var(--tw-hairline);
    color: var(--tw-ink-soft);
  }
  .shell-lesson-view-summary:hover,
  .shell-lesson-view-summary:focus-visible,
  .shell-assign-cancel:hover,
  .shell-assign-cancel:focus-visible,
  .shell-summary-select-choice:hover,
  .shell-summary-select-choice:focus-visible {
    border-color: var(--tw-nav-edge);
  }

  /* Consistent focus treatment across every interactive control in
     the teacher surface. Preserves keyboard-navigation clarity. */
  .shell-nav-button:focus-visible,
  .shell-signout:focus-visible,
  .shell-filter-pill:focus-visible,
  .shell-lesson-assign:focus-visible,
  .shell-lesson-view-summary:focus-visible,
  .shell-lesson-toggle:focus-visible,
  .shell-assign-confirm:focus-visible,
  .shell-assign-cancel:focus-visible,
  .shell-summary-select-choice:focus-visible,
  .shell-classes-create-open:focus-visible,
  .shell-classes-create-actions button:focus-visible,
  .shell-classes-joincode-dismiss:focus-visible,
  .shell-integrations-back:focus-visible {
    outline: none;
    box-shadow: var(--tw-focus-ring);
  }

  /* Modal + inline callouts: refined elevation, softer hairlines. */
  .shell-assign-dialog {
    border-radius: var(--tw-radius-card);
    box-shadow: var(--tw-shadow-elev);
  }
  .shell-assign-row,
  .shell-integrations-candidate,
  .shell-classes-create-form {
    border-color: var(--tw-hairline);
    background: var(--tw-surface-alt);
    border-radius: var(--tw-radius-card);
  }

  /* Placeholder tiles (Dashboard preview grid). Slightly warmer than
     the page canvas, quieter ink, so they read as "coming soon"
     without feeling broken. */
  .shell-placeholder-card {
    background: var(--tw-surface-alt);
    border-color: var(--tw-hairline);
    border-radius: var(--tw-radius-card);
    color: var(--tw-ink-muted);
  }
  .shell-placeholder-card:hover,
  .shell-placeholder-card:focus { background: var(--tw-surface-alt); }
  .shell-placeholder-title { color: var(--tw-ink-soft); }

  /* Footer: aligned with the calmer ink scale. */
  .shell-footer {
    color: var(--tw-ink-muted);
    border-top-color: var(--tw-hairline-soft);
  }

  /* Respect user motion preferences: the additions above are subtle
     but honor reduced-motion just like the base sheet does. */
  @media (prefers-reduced-motion: reduce) {
    .shell-nav-button,
    .shell-signout,
    .shell-filter-pill,
    .shell-lesson-assign,
    .shell-lesson-view-summary,
    .shell-assign-confirm,
    .shell-assign-cancel,
    .shell-summary-select-choice {
      transition: none !important;
    }
  }

  /* ------------------------------------------------------------------
     Sprint 20: Teacher Visual Identity Refinement, Pass 2.
     Focused amendment layered on top of Pass 1. Resolves the remaining
     conflict between the teacher token layer and legacy hardcoded
     shell colors/radii that still visually contradict it. No new
     components, class names, copy, DOM, or interaction. Only calmer
     palette derivatives and radius/heading unification applied to
     existing selectors. Semantic tokens listed here so the amendment
     block reads as one system. Contrast preserved WCAG AA on white
     canvas. Intentional legacy retained: the LyfeLabz green primary
     button identity, because it must remain instantly recognizable
     across student + teacher surfaces per the identity spec. */
  :root {
    --tw-topic-life-bg:      rgba(53, 118, 84, 0.10);
    --tw-topic-life-ink:     #1f6b3d;
    --tw-topic-earth-bg:     rgba(107, 88, 148, 0.10);
    --tw-topic-earth-ink:    #4d3d78;
    --tw-topic-physical-bg: rgba(160, 84, 60, 0.10);
    --tw-topic-physical-ink: #7a3e22;
    --tw-topic-tech-bg:     rgba(140, 106, 40, 0.10);
    --tw-topic-tech-ink:    #6a5010;

    --tw-badge-neutral-bg:  rgba(28, 39, 51, 0.055);
    --tw-badge-neutral-ink: var(--tw-ink-soft);

    --tw-toggle-inactive-bg:  var(--tw-surface);
    --tw-toggle-inactive-ink: var(--tw-ink-muted);
    --tw-toggle-active-bg:    var(--tw-nav-wash);
    --tw-toggle-active-edge:  var(--tw-nav-edge);
    --tw-toggle-active-ink:   var(--tw-nav-edge);

    --tw-pill-verified-bg:   rgba(26, 95, 111, 0.12);
    --tw-pill-verified-ink:  #124651;
    --tw-pill-verified-edge: rgba(26, 95, 111, 0.30);

    --tw-callout-info-bg:      rgba(26, 95, 111, 0.08);
    --tw-callout-info-edge:    rgba(26, 95, 111, 0.28);
    --tw-callout-info-ink:     #124651;
    --tw-callout-success-bg:   rgba(31, 107, 61, 0.08);
    --tw-callout-success-edge: rgba(31, 107, 61, 0.30);
    --tw-callout-success-ink:  var(--tw-primary-strong);
    --tw-callout-error-bg:     rgba(160, 84, 60, 0.08);
    --tw-callout-error-edge:   rgba(160, 84, 60, 0.32);
    --tw-callout-error-ink:    #7a3e22;
  }

  /* 1. Topic + grade badges: calmer, teacher-side variants. Preserved
        differentiation, softened saturation, ink from the teacher
        scale. */
  .shell-lesson-badge {
    background: var(--tw-badge-neutral-bg);
    color: var(--tw-badge-neutral-ink);
    border-color: var(--tw-hairline);
    border-radius: var(--tw-radius-pill);
  }
  .shell-lesson-topic-life-science {
    background: var(--tw-topic-life-bg);
    color: var(--tw-topic-life-ink);
  }
  .shell-lesson-topic-earth-space {
    background: var(--tw-topic-earth-bg);
    color: var(--tw-topic-earth-ink);
  }
  .shell-lesson-topic-physical-science {
    background: var(--tw-topic-physical-bg);
    color: var(--tw-topic-physical-ink);
  }
  .shell-lesson-topic-tech-engineering {
    background: var(--tw-topic-tech-bg);
    color: var(--tw-topic-tech-ink);
  }
  .shell-integrations-pill-inactive {
    background: var(--tw-badge-neutral-bg);
    color: var(--tw-ink-muted);
    border-color: var(--tw-hairline);
  }
  /* Sprint 26 Phase 4: "action needed" pill, teacher-workspace palette. */
  .shell-integrations-pill-attention {
    background: rgba(176, 122, 26, 0.14);
    color: #7a5210;
    border: 1px solid rgba(122, 82, 16, 0.30);
  }

  /* 2. Inactive toggle: neutral teacher-side treatment. Active toggle
        adopts the muted-teal teacher accent (matching nav + filter
        chips) so the on/off relationship reads clearly without the
        legacy orange competing for attention. Behavior unchanged. */
  .shell-lesson-toggle {
    background: var(--tw-toggle-inactive-bg);
    border-color: var(--tw-hairline);
    color: var(--tw-toggle-inactive-ink);
    border-radius: var(--tw-radius-pill);
  }
  .shell-lesson-toggle-inactive {
    background: var(--tw-toggle-inactive-bg);
    border-color: var(--tw-hairline);
    color: var(--tw-toggle-inactive-ink);
  }
  .shell-lesson-toggle-active {
    background: var(--tw-toggle-active-bg);
    border-color: var(--tw-toggle-active-edge);
    color: var(--tw-toggle-active-ink);
  }
  .shell-lesson-toggle:hover,
  .shell-lesson-toggle:focus-visible {
    border-color: var(--tw-nav-edge);
  }

  /* 3. Verified pill: teacher identity replacement for the gold
        treatment. Copy + meaning preserved; palette drops into the
        teal identity. */
  .shell-pill-verified {
    background: var(--tw-pill-verified-bg);
    color: var(--tw-pill-verified-ink);
    border: 1px solid var(--tw-pill-verified-edge);
  }

  /* 4. Section-heading tier: one consistent step between the page
        welcome (1.7rem) and body copy. Applied to card titles and
        section-level headings that previously sat at ~1.00-1.05rem. */
  .shell-placeholder-title,
  .shell-integrations-heading,
  .shell-assign-title,
  .shell-classes-create-heading,
  .shell-classes-joincode-heading,
  .shell-lesson-title {
    font-size: 1.18rem;
    font-weight: 600;
    color: var(--tw-ink);
    letter-spacing: -0.006em;
    line-height: 1.3;
  }
  .shell-lesson-card-inactive .shell-lesson-title { color: var(--tw-ink-muted); }
  .shell-classes-joincode-heading { color: var(--tw-primary-strong); }

  /* 5. Semantic callouts: teacher-side palette derivatives. */
  .shell-integrations-error,
  .shell-classes-create-error {
    background: var(--tw-callout-error-bg);
    border-color: var(--tw-callout-error-edge);
    color: var(--tw-callout-error-ink);
    border-radius: var(--tw-radius-control);
  }
  .shell-integrations-info {
    background: var(--tw-callout-info-bg);
    border-color: var(--tw-callout-info-edge);
    color: var(--tw-callout-info-ink);
    border-radius: var(--tw-radius-control);
  }
  .shell-curriculum-success {
    background: var(--tw-callout-success-bg);
    border-color: var(--tw-callout-success-edge);
    color: var(--tw-callout-success-ink);
    border-radius: var(--tw-radius-control);
  }
  /* Assign confirmation toast (ASSIGN_EXPERIENCE.md B6).
     showSuccess() adds .shell-curriculum-success-visible when the banner
     is shown, so the visible STATE owns the toast presentation. The
     compound selector (specificity 0,2,0) reliably outranks both the base
     .shell-curriculum-success rule and the token-unification callout rule
     above, so the fixed toast wins the cascade regardless of source order.

     top clears the in-flow application header (.shell-header): the wordmark
     line box is 24.3px * 1.6 = 38.88px, or 44px touch targets on coarse
     pointers, plus 15.3px * 2 block padding and a 1px border, i.e. a header
     of ~70.5px (desktop) to ~75.6px (touch). 5.5rem = 88px at the app's
     16px root clears the tallest case with ~12px of breathing room and
     stays constant across breakpoints (the header keeps canonical padding
     and wordmark size on phones). The background is an OPAQUE success tint
     (rgba(61,220,132,0.12) composited over white) so the floating toast
     stays readable over arbitrary page content, unlike the ~8%-opaque
     inline callout token. Fixed positioning leaves the teacher's scroll
     untouched. */
  .shell-curriculum-success.shell-curriculum-success-visible {
    position: fixed;
    top: 5.5rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 900;
    width: max-content;
    max-width: min(34rem, calc(100vw - 2rem));
    box-sizing: border-box;
    margin: 0;
    text-align: center;
    background: #e8fbf0;
    border: 1px solid rgba(31, 107, 61, 0.30);
    color: #175a31;
    border-radius: 6px;
    padding: 0.55rem 0.85rem;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
  }
  .shell-classes-joincode {
    background: var(--tw-callout-success-bg);
    border-color: var(--tw-callout-success-edge);
    border-radius: var(--tw-radius-card);
  }

  /* 6. Radius + token unification. Pass 1 addressed the primary
        controls. This pass resolves remaining 4px legacy overrides
        on form inputs, callouts, and small controls so every teacher
        surface honors the same radius scale. */
  .shell-form input,
  .shell-form select,
  .shell-assign-field input,
  .shell-assign-field select,
  .shell-assign-lms-topic-select,
  .shell-integrations-select {
    border-radius: var(--tw-radius-control);
    border-color: var(--tw-hairline);
  }
  .shell-assign-cancel,
  .shell-assign-confirm {
    border-radius: var(--tw-radius-control);
  }
  .shell-classes-joincode-dismiss {
    border-radius: var(--tw-radius-control);
    border-color: var(--tw-hairline);
    color: var(--tw-ink-soft);
  }
  .shell-classes-joincode-dismiss:hover,
  .shell-classes-joincode-dismiss:focus-visible {
    border-color: var(--tw-nav-edge);
  }

  /* Optional low-risk refinements (visual-only). */
  .shell-nav-brand { letter-spacing: 0.02em; }
  .shell-signout {
    color: var(--tw-ink-muted);
    font-size: 0.92rem;
  }
  .shell-placeholder-card {
    border-style: dashed;
    border-color: var(--tw-hairline);
  }
  /* Assignment Status Bar (Sprint 20 refinement):
     - The Assign / Assigned control keeps an identical footprint across
       states so it feels like the same control changing rather than
       being replaced. Only fill, border, and ink change on assignment.
     - View summaries reads as a quiet, right-side management action so
       it never competes with the primary Assign / Assigned control. */
  /* Assigned state reads as a compact status affordance, not a boxed
     button. Border, fill, and shadow are stripped so it sits quietly
     next to the primary View summaries control on the right. */
  .shell-lesson-assign-assigned {
    background: transparent;
    color: var(--tw-primary-strong);
    border: 1px solid transparent;
    box-shadow: none;
    padding: 0.15rem 0.25rem 0.15rem 0;
    min-height: 0;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: default;
  }
  .shell-lesson-assign-assigned:hover,
  .shell-lesson-assign-assigned:focus-visible {
    background: transparent;
    border-color: transparent;
    color: var(--tw-primary-strong);
  }
  .shell-lesson-view-summary {
    padding: 0.2rem 0.6rem;
    font-size: 0.85rem;
    min-height: 30px;
    background: var(--tw-surface);
    color: var(--tw-ink-soft);
    border-color: var(--tw-hairline);
    box-shadow: none;
    font-weight: 500;
  }
  .shell-lesson-view-summary:hover,
  .shell-lesson-view-summary:focus-visible {
    background: var(--tw-surface);
    border-color: var(--tw-nav-edge);
    color: var(--tw-ink);
  }
  @media (pointer: coarse) {
    .shell-lesson-view-summary { min-height: 44px; }
  }

  /* Active Assignments accordion toggle: compact, quiet, no caret. The
     control relies on its text label plus aria-expanded rather than a
     disclosure glyph. */
  .shell-active-assignments {
    margin: 0.5rem 0 1rem 0;
  }
  .shell-active-assignments-toggle-btn {
    display: inline-flex;
    align-items: center;
    padding: 0.25rem 0.7rem;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    background: var(--tw-surface);
    color: var(--tw-ink-soft);
    border: 1px solid var(--tw-hairline);
    border-radius: var(--tw-radius-pill);
    cursor: pointer;
    min-height: 30px;
    line-height: 1.2;
  }
  .shell-active-assignments-toggle-btn:hover,
  .shell-active-assignments-toggle-btn:focus-visible {
    border-color: var(--tw-nav-edge);
    color: var(--tw-nav-edge);
    outline: none;
    box-shadow: var(--tw-focus-ring);
  }
  .shell-active-assignments-toggle-btn[aria-expanded="true"] {
    background: var(--tw-nav-wash);
    border-color: var(--tw-nav-edge);
    color: var(--tw-nav-edge);
  }
  .shell-active-assignments-summaries {
    margin: 0.4rem 0 0 0;
  }
  .shell-active-assignment-summary {
    margin: 0.15rem 0;
    font-size: 0.85rem;
    color: var(--tw-ink-muted);
  }
  @media (pointer: coarse) {
    .shell-active-assignments-toggle-btn { min-height: 44px; }
  }

  /* ------------------------------------------------------------------
     Sprint 20: Teacher Visual Identity Refinement, Pass 3
     (Shell Branding & Chrome Palette).
     Purely visual layer on top of Pass 1 + Pass 2. Introduces no new
     components, class names, copy, DOM, workflow, routing, or
     interaction. The Curriculum four-column grid, lesson-card layout,
     responsive breakpoints, and accessibility contracts are untouched.

     Palette intent (per sprint brief):
       - move away from the previous stark white/black header
       - introduce a softer slate blue-gray application chrome,
         inspired by the public site's body background but calmer
       - reuse the canonical gold LYFELABZ wordmark (Orbitron 900,
         #f5c842) from the public LyfeLabz experience rather than
         inventing a new logo
       - preserve the warm gray workspace canvas
       - preserve white content surfaces
       - preserve LyfeLabz green primary actions
       - preserve muted teal navigation accents
       - preserve topic pill colors
     ------------------------------------------------------------------ */
  :root {
    /* Chrome (application header) palette. Deep slate blue-gray sits
       between the public site's #1a2535 body and the teacher warm-gray
       canvas: unmistakably part of the LyfeLabz family, calmer than
       the marketing surface, focused enough for daily planning. */
    --tw-chrome:              #2b3a4f;
    --tw-chrome-ink:          #f2f4f8;
    --tw-chrome-ink-muted:    #adb7c4;
    --tw-chrome-edge:         rgba(255, 255, 255, 0.14);
    --tw-chrome-edge-strong:  rgba(255, 255, 255, 0.28);
    --tw-chrome-shadow:       0 1px 0 rgba(10, 18, 30, 0.35);

    /* Canonical gold wordmark tokens. Variable names + values mirror
       the public homepage :root exactly (index.html --gold /
       --gold-glow), so the LYFELABZ wordmark is a single canonical
       brand definition shared across the public experience and the
       authenticated Teacher Workspace. Do not fork these into a
       teacher-specific variant. */
    --gold:                   #f5c842;
    --gold-glow:              rgba(245, 200, 66, 0.35);

    /* Subtle in-sidebar "Workspace" section label + a slightly
       stronger divider beneath it, so it reads as a distinct nav
       section without competing with the navigation items themselves. */
    --tw-workspace-label-ink: #6c7683;
    --tw-workspace-divider:   rgba(28, 39, 51, 0.16);
  }

  /* Header chrome: slate blue-gray replaces the prior white surface.
     Height, spacing, layout, and every control keep their footprint. */
  #app-root:has(> .shell-header) .shell-header {
    background: var(--tw-chrome);
    border-bottom: 1px solid var(--tw-chrome-edge);
    box-shadow: var(--tw-chrome-shadow);
  }

  /* Canonical LYFELABZ wordmark. Byte-for-byte parity with the public
     homepage .nav-logo (index.html:82) so the wordmark renders
     identically across the marketing site and the Teacher Workspace.
     Font-size is expressed in px (24.3px = 1.35rem @ homepage root
     font-size:18px) so it does not drift with the app's 16px html
     scale. Line-height mirrors the public site body (1.6) so the
     wordmark line-box matches the homepage exactly, and combined with
     the header's 15.3px block padding it reproduces the homepage nav
     thickness. */
  .shell-brand {
    font-family: 'Orbitron', sans-serif;
    font-size: 24.3px;
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 0.06em;
    text-shadow: 0 0 18px var(--gold-glow);
    line-height: 1.6;
  }

  /* Identity, notifications, and sign-out sit on dark chrome now,
     so their inks lift to the chrome scale for legibility. */
  .shell-header-identity { color: var(--tw-chrome-ink); }
  .shell-notifications   { color: var(--tw-chrome-ink-muted); }
  .shell-signout {
    color: var(--tw-chrome-ink);
    border-color: var(--tw-chrome-edge);
    background: transparent;
  }
  .shell-signout:hover,
  .shell-signout:focus-visible {
    border-color: var(--tw-chrome-edge-strong);
    background: rgba(255, 255, 255, 0.06);
    color: var(--tw-chrome-ink);
  }
  .shell-signout:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(245, 200, 66, 0.35);
  }

  /* Sidebar "Workspace" section label. The nav-brand button keeps its
     testid + role for every certified navigation test; only its visual
     treatment changes: quiet uppercase micro-label, calmer ink, and a
     slightly stronger divider beneath so it reads as a distinct
     section heading rather than a second brand mark. */
  .shell-nav-brand {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, "Helvetica Neue", Arial, sans-serif;
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--tw-workspace-label-ink);
    padding-top: 0.85rem;
    padding-bottom: 0.55rem;
    margin-bottom: 0.65rem;
    border-bottom: 1px solid var(--tw-workspace-divider);
    cursor: pointer;
  }
  .shell-nav-brand:hover,
  .shell-nav-brand:focus-visible { color: var(--tw-ink-soft); }
  .shell-nav-brand.shell-nav-active {
    color: var(--tw-workspace-label-ink);
    background: transparent;
  }

  /* Footer sits on the warm canvas already; a matching hairline color
     keeps the divider language consistent with the strengthened
     Workspace divider above. */
  .shell-footer { border-top-color: var(--tw-hairline); }

  /* ==================================================================
     Sprint 28.5D: Teacher Workspace UX Polish.

     Closes the "two design eras" gap the 28.5C audit found: the
     post-Sprint-20 surfaces (Assignment Detail, Active Assignments, the
     class workspace / Snapshot / Roster) emitted shell-* class names that
     had no CSS and rendered with browser defaults. This block gives those
     classes the same calm card / button / status grammar as the Sprint 20
     surfaces, defines the shared management controls (shell-btn,
     shell-spinner), and tightens Curriculum density at classroom widths.
     Presentation only: it reuses the existing --tw-* tokens, introduces no
     new design system, and adds no new components, copy, or DOM.
     ================================================================== */

  /* ---- D1: shared teacher management controls ---------------------- */

  /* shell-btn is the canonical management button. The default is a calm
     secondary control: management actions (Open assignment, Close/Reopen,
     Add, Try again) should read as intentional without every one becoming
     a bright green primary CTA. Native <button> semantics, accessible
     names, and testids are owned by the markup; this rule only paints. */
  .shell-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    margin: 0;
    padding: 0.45rem 0.9rem;
    min-height: 36px;
    font: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    line-height: 1.2;
    color: var(--tw-ink-soft);
    background: var(--tw-surface);
    border: 1px solid var(--tw-hairline);
    border-radius: var(--tw-radius-control);
    cursor: pointer;
    box-sizing: border-box;
    transition: background 0.15s ease, border-color 0.15s ease,
                box-shadow 0.15s ease, color 0.15s ease;
  }
  .shell-btn:hover {
    border-color: var(--tw-nav-edge);
    color: var(--tw-ink);
  }
  .shell-btn:disabled,
  .shell-btn[aria-busy="true"] {
    opacity: 0.6;
    cursor: default;
    border-color: var(--tw-hairline);
    color: var(--tw-ink-muted);
  }
  /* --primary opts a control into the LyfeLabz green identity; --danger
     is a calm reversible-lifecycle treatment (never an alarming
     destructive red). The modifiers exist so future management surfaces
     can reach for hierarchy without redefining the button. */
  .shell-btn-primary {
    color: #fff;
    background: var(--tw-primary);
    border-color: var(--tw-primary-strong);
    box-shadow: 0 1px 2px rgba(23, 90, 49, 0.18);
  }
  .shell-btn-primary:hover {
    background: var(--tw-primary-strong);
    border-color: var(--tw-primary-strong);
    color: #fff;
  }
  .shell-btn-danger {
    color: var(--tw-callout-error-ink);
    background: var(--tw-surface);
    border-color: var(--tw-callout-error-edge);
  }
  .shell-btn-danger:hover {
    background: var(--tw-callout-error-bg);
    border-color: var(--tw-callout-error-edge);
  }
  /* Publish advances a draft to published: the single deliberate forward
     action on the draft detail view, so it carries the green primary
     identity. Every other lifecycle/management action stays a calm
     secondary shell-btn (restraint check: not every action is a CTA). */
  .shell-btn.shell-assignment-detail-publish-action {
    color: #fff;
    background: var(--tw-primary);
    border-color: var(--tw-primary-strong);
    box-shadow: 0 1px 2px rgba(23, 90, 49, 0.18);
  }
  .shell-btn.shell-assignment-detail-publish-action:hover {
    background: var(--tw-primary-strong);
    color: #fff;
  }

  /* shell-spinner: a restrained loading indicator. The accessible
     loading semantics (role="status", aria-live, the visible label) stay
     in the markup; the spinner is aria-hidden decoration. */
  .shell-spinner {
    display: inline-block;
    width: 1rem;
    height: 1rem;
    border: 2px solid var(--tw-hairline);
    border-top-color: var(--tw-nav-edge);
    border-radius: 50%;
    vertical-align: -0.15rem;
    animation: shell-spin 0.7s linear infinite;
  }
  @keyframes shell-spin { to { transform: rotate(360deg); } }

  /* Consistent teal focus ring for the newly-styled controls, matching
     the Sprint 20 allowlist so keyboard focus is uniform across the
     workspace. */
  .shell-btn:focus-visible,
  .shell-class-nav-button:focus-visible,
  .shell-active-assignments-toggle-btn:focus-visible,
  .shell-assignment-detail-back:focus-visible,
  .shell-assignment-detail-late-recipients-add:focus-visible,
  .shell-class-workspace-back:focus-visible {
    outline: none;
    box-shadow: var(--tw-focus-ring);
    border-color: var(--tw-nav-edge);
  }

  /* Shared quiet status pill, reused across the newer surfaces so the few
     real statuses get one consistent treatment (audit §17: keep the
     restraint, do not proliferate pills). */
  .shell-assignment-detail-status,
  .shell-snapshot-status,
  .shell-class-status {
    display: inline-block;
    padding: 0.12rem 0.6rem;
    border-radius: var(--tw-radius-pill);
    font-size: 0.8rem;
    font-weight: 600;
    line-height: 1.5;
    background: var(--tw-badge-neutral-bg);
    color: var(--tw-ink-soft);
    border: 1px solid var(--tw-hairline);
  }
  /* Live / positive states adopt the teal identity; closed/archived stay
     neutral; draft / needs-setup use the calm amber attention tint. */
  .shell-assignment-detail-status-published,
  .shell-snapshot-status-active,
  .shell-class-status-active {
    background: var(--tw-pill-verified-bg);
    color: var(--tw-pill-verified-ink);
    border-color: var(--tw-pill-verified-edge);
  }
  .shell-assignment-detail-status-closed,
  .shell-snapshot-status-archived,
  .shell-class-status-archived {
    background: var(--tw-badge-neutral-bg);
    color: var(--tw-ink-muted);
    border-color: var(--tw-hairline);
  }
  .shell-assignment-detail-status-draft,
  .shell-snapshot-status-needsSetup,
  .shell-class-status-needsSetup {
    background: rgba(176, 122, 26, 0.14);
    color: #7a5210;
    border-color: rgba(122, 82, 16, 0.30);
  }

  /* ---- D2B: Assignment Detail --------------------------------------- */

  /* The detail surface renders inside the shell outlet (D2A), so it
     inherits the left-aligned reading order. The outer node carries
     shell-card in markup; neutralize it here so Detail is a page frame
     (not a card-in-card container) whose sections own the card grammar. */
  .shell-assignment-detail {
    background: transparent;
    border: 0;
    box-shadow: none;
    padding: 0;
    margin: 0;
    max-width: 62rem;
  }
  /* "Assignment" reads as a quiet eyebrow above the real title. */
  .shell-assignment-detail-headline {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--tw-ink-muted);
    margin: 0 0 0.35rem 0;
    outline: none;
  }
  .shell-assignment-detail-back {
    display: inline-block;
    margin: 0 0 0.85rem 0;
    padding: 0.3rem 0;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--tw-radius-control);
    color: var(--tw-nav-edge);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .shell-assignment-detail-back:hover { text-decoration: underline; }
  .shell-assignment-detail-body { display: block; }

  /* Header groups identity + state + lifecycle in one surface. */
  .shell-assignment-detail-header {
    background: var(--tw-surface);
    border: 1px solid var(--tw-hairline);
    border-radius: var(--tw-radius-card);
    box-shadow: var(--tw-shadow-card);
    padding: 1rem 1.15rem;
    margin: 0 0 1rem 0;
  }
  .shell-assignment-detail-title {
    font-size: 1.35rem;
    font-weight: 600;
    color: var(--tw-ink);
    margin: 0 0 0.7rem 0;
    outline: none;
  }
  /* Meta becomes a row of label-over-value groups instead of
     undifferentiated stacked text (audit §12). */
  .shell-assignment-detail-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem 1.75rem;
    margin: 0 0 0.85rem 0;
  }
  .shell-assignment-detail-meta-pair {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    align-items: flex-start;
  }
  .shell-assignment-detail-meta-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--tw-ink-muted);
    margin: 0;
  }
  .shell-assignment-detail-meta-value {
    margin: 0;
    color: var(--tw-ink);
    font-weight: 500;
  }
  .shell-assignment-detail-lifecycle {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    margin: 0;
  }
  .shell-assignment-detail-draft-label,
  .shell-assignment-detail-closed-label {
    margin: 0;
    color: var(--tw-ink-muted);
    font-weight: 500;
  }
  /* Lifecycle error lines are real red callouts and wrap to their own row
     below the actions (audit §18: role="alert" should look like an error). */
  .shell-assignment-detail-close-error,
  .shell-assignment-detail-reopen-error,
  .shell-assignment-detail-publish-error {
    flex: 1 0 100%;
    margin: 0.35rem 0 0 0;
    padding: 0.5rem 0.75rem;
    background: var(--tw-callout-error-bg);
    border: 1px solid var(--tw-callout-error-edge);
    border-radius: var(--tw-radius-control);
    color: var(--tw-callout-error-ink);
    font-size: 0.9rem;
  }

  /* Section surfaces. The plain (non-draft) summary host is a transparent
     wrapper because the Assignment Summary card inside it already carries
     shell-card; every other section is a card in its own right. */
  .shell-assignment-detail-summary { margin: 0 0 1rem 0; }
  .shell-assignment-detail-roster,
  .shell-assignment-detail-late-recipients,
  .shell-assignment-detail-questions,
  .shell-assignment-detail-lms,
  .shell-assignment-detail-draft-summary {
    background: var(--tw-surface);
    border: 1px solid var(--tw-hairline);
    border-radius: var(--tw-radius-card);
    box-shadow: var(--tw-shadow-card);
    padding: 1rem 1.15rem;
    margin: 0 0 1rem 0;
  }
  .shell-assignment-detail-roster-heading,
  .shell-assignment-detail-late-recipients-heading,
  .shell-assignment-detail-questions-heading,
  .shell-assignment-detail-lms-heading,
  .shell-assignment-detail-draft-summary-heading,
  .shell-assignment-summary-headline {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--tw-ink);
    margin: 0 0 0.6rem 0;
  }
  .shell-assignment-detail-draft-summary-body,
  .shell-assignment-detail-roster-empty,
  .shell-assignment-detail-roster-empty-recipients,
  .shell-assignment-detail-roster-discrepancy,
  .shell-assignment-detail-loading-label,
  .shell-assignment-detail-empty {
    color: var(--tw-ink-muted);
    margin: 0.25rem 0 0 0;
  }
  .shell-assignment-detail-loading {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--tw-ink-muted);

  body:not(:has(#app-root > .shell-header)) [data-testid=refresh],
  body:not(:has(#app-root > .shell-header)) [data-testid=assignments-retry],
  body:not(:has(#app-root > .shell-header)) [data-testid=results-retry] {
    display: inline-block;
    margin-top: 1rem;
    padding: 0.7rem 1.4rem;
    background: var(--tw-primary);
    color: #fff;
    border: 1px solid var(--tw-primary);
    border-radius: var(--tw-radius-control);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    min-height: 44px;
    min-width: 12rem;
    box-shadow: 0 1px 2px rgba(23, 90, 49, 0.22);
    transition: background 0.15s ease, border-color 0.15s ease,
                box-shadow 0.15s ease;
  }
  body:not(:has(#app-root > .shell-header)) [data-testid=google-signin]:hover:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=google-signin]:focus-visible:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=request-verification]:hover:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=request-verification]:focus-visible:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=join-class]:hover:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=join-class]:focus-visible:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=check-status]:hover:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=check-status]:focus-visible:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=retry]:hover:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=retry]:focus-visible:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=refresh]:hover:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=refresh]:focus-visible:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=assignments-retry]:hover:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=assignments-retry]:focus-visible:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=results-retry]:hover:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=results-retry]:focus-visible:not(:disabled) {
    background: var(--tw-primary-strong);
    border-color: var(--tw-primary-strong);
    outline: none;
    box-shadow: 0 0 0 3px rgba(31, 107, 61, 0.28);
  }
  body:not(:has(#app-root > .shell-header)) [data-testid=return-link] {
    display: block;
    margin-top: 1.5rem;
    font-size: 0.88rem;
    color: #607285;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
  }
  body:not(:has(#app-root > .shell-header)) [data-testid=return-link]:hover,
  body:not(:has(#app-root > .shell-header)) [data-testid=return-link]:focus-visible {
    color: var(--tw-nav-edge);
    border-bottom-color: rgba(26, 95, 111, 0.4);
    outline: none;
  }
  body:not(:has(#app-root > .shell-header)) [data-testid=sign-out] {
    display: inline-block;
    margin-top: 1rem;
    padding: 0.5rem 1rem;
    background: transparent;
    color: var(--tw-ink-muted);
    border: 1px solid var(--tw-hairline);
    border-radius: var(--tw-radius-control);
    font: inherit;
    cursor: pointer;
    min-height: 40px;
  }
  body:not(:has(#app-root > .shell-header)) [data-testid=sign-out]:hover,
  body:not(:has(#app-root > .shell-header)) [data-testid=sign-out]:focus-visible {
    border-color: var(--tw-nav-edge);
    color: var(--tw-ink);
    outline: none;
  }
  /* Sprint 28.5B (B5): the student assignment/results error renderers call
     renderErrorBanner (which stamps data-testid="error-banner", the callout
     hook) and then overwrite the testid with assignments-error / results-error
     for their retry tests. That overwrite dropped the red-callout styling, so
     the error read as plain muted text. Widen the selector to the two student
     variants so both error surfaces show the intended callout. role="alert"
     semantics, the retry buttons, and the assignments-error / results-error
     testids the tests assert on are all unchanged. */
  body:not(:has(#app-root > .shell-header)) [data-testid=error-banner],
  body:not(:has(#app-root > .shell-header)) [data-testid=assignments-error],
  body:not(:has(#app-root > .shell-header)) [data-testid=results-error] {
    background: var(--tw-callout-error-bg);
    border: 1px solid var(--tw-callout-error-edge);
    color: var(--tw-callout-error-ink);
    border-radius: var(--tw-radius-control);
    padding: 0.6rem 0.85rem;
    margin: 0.75rem 0 0;
    text-align: left;
  }
  body:not(:has(#app-root > .shell-header)) [data-testid=loading-indicator] {
    color: var(--tw-ink-muted);
  }
  /* Provisioned / student onboarding forms centered inside the card. */
  body:not(:has(#app-root > .shell-header)) .shell-section {
    text-align: left;
    margin: 1.25rem 0 0;
    padding: 1rem 1.1rem;
    background: var(--tw-surface-alt);
    border: 1px solid var(--tw-hairline);
    border-radius: var(--tw-radius-card);
  }
  body:not(:has(#app-root > .shell-header)) .shell-section h2 {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--tw-ink);
    margin: 0 0 0.35rem 0;
  }
  body:not(:has(#app-root > .shell-header)) .shell-form {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin: 0.5rem 0 0.25rem;
  }
  body:not(:has(#app-root > .shell-header)) .shell-form label {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    font-size: 0.9rem;
    color: var(--tw-ink-soft);
  }
  body:not(:has(#app-root > .shell-header)) .shell-form input {
    font: inherit;
    padding: 0.5rem 0.6rem;
    min-height: 40px;
    border: 1px solid var(--tw-hairline);
    border-radius: var(--tw-radius-control);
    background: var(--tw-surface);
    color: var(--tw-ink);
  }
  body:not(:has(#app-root > .shell-header)) .shell-form input:focus-visible {
    outline: none;
    border-color: var(--tw-nav-edge);
    box-shadow: var(--tw-focus-ring);
  }
  body:not(:has(#app-root > .shell-header)) .shell-small {
    display: block;
    font-size: 0.8rem;
    color: var(--tw-ink-muted);
  }

  /* =====================================================================
     Sprint 28.5B - Student Workspace polish (My Assignments / My Results)
     =====================================================================
     A single scoped presentation layer over the certified student surface
     (makeActiveStudentSurface). It reuses the existing auth-card tokens,
     colors, spacing, radii, and typography; it introduces no second design
     system, no gamification, and no new domain data, and it changes no
     behavior, label, launch URL, authorization, lifecycle, or accessibility
     semantic. Every rule is gated by the auth-card scope AND a student-only
     hook (the tablist, the assignment/result lists, the cards, and the status
     chip), so no teacher-workspace control and no sibling auth-card surface
     (signed-out / provisioned / pending / error / admin) is affected. */

  /* B2 - Tablist selected state. Give My Assignments / My Results an obvious
     selected cue that never relies on color alone: the selected tab carries a
     filled wash, a heavier ink, and a solid accent underline bar; the
     unselected tab stays quiet. All ARIA (role=tab, aria-selected, roving
     tabindex, Arrow/Home/End) is owned by the JS and untouched. */
  body:not(:has(#app-root > .shell-header)) [data-testid=student-nav] {
    display: flex;
    gap: 0.4rem;
    justify-content: center;
    flex-wrap: wrap;
    margin: 1.25rem 0 0.25rem;
    border-bottom: 1px solid var(--tw-hairline);
  }
  body:not(:has(#app-root > .shell-header)) [data-testid=student-nav] [role=tab] {
    margin: 0;
    margin-bottom: -1px;
    padding: 0.55rem 1rem;
    background: transparent;
    color: var(--tw-ink-muted);
    border: 1px solid transparent;
    border-bottom: 3px solid transparent;
    border-top-left-radius: var(--tw-radius-control);
    border-top-right-radius: var(--tw-radius-control);
    font-weight: 600;
    min-height: 44px;
  }
  body:not(:has(#app-root > .shell-header)) [data-testid=student-nav] [role=tab]:hover {
    color: var(--tw-ink);
    background: var(--tw-nav-wash);
  }
  body:not(:has(#app-root > .shell-header)) [data-testid=student-nav] [role=tab][aria-selected=true] {
    color: var(--tw-nav-edge);
    background: var(--tw-nav-wash);
    border-bottom-color: var(--tw-nav-edge);
  }
  body:not(:has(#app-root > .shell-header)) [data-testid=student-nav] [role=tab]:focus-visible {
    outline: none;
    box-shadow: var(--tw-focus-ring);
    border-radius: var(--tw-radius-control);
  }

  /* B3 - Assignment / result cards. Remove the default <ul> disc bullets and
     40px indent and turn each item into one discrete, left-aligned card in the
     existing card language (surface, hairline border, card radius, soft
     shadow). The list stays a semantic <ul>/<li>; only its presentation
     changes. Vertical stacking of title -> status -> action avoids the
     status/button collision the audit found at tablet width. */
  body:not(:has(#app-root > .shell-header)) [data-testid=assignments-list],
  body:not(:has(#app-root > .shell-header)) [data-testid=results-list] {
    list-style: none;
    margin: 1.25rem 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    text-align: left;
  }
  body:not(:has(#app-root > .shell-header)) [data-testid=assignments-item],
  body:not(:has(#app-root > .shell-header)) [data-testid=results-item] {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
    margin: 0;
    padding: 0.9rem 1rem;
    background: var(--tw-surface);
    border: 1px solid var(--tw-hairline);
    border-radius: var(--tw-radius-card);
    box-shadow: 0 1px 2px rgba(28, 39, 51, 0.04);
  }

  /* B4 - Title hierarchy. The per-card <h2> defaults to page-headline size and
     weight, so every card competed as a headline and none won. Calm it to a
     scannable card title that sits below the page welcome. Heading semantics,
     the aria-labelledby wiring, and the data-testid are unchanged. */
  body:not(:has(#app-root > .shell-header)) [data-testid=assignments-item-title],
  body:not(:has(#app-root > .shell-header)) [data-testid=results-item-title] {
    margin: 0;
    font-size: 1.08rem;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: -0.005em;
    color: var(--tw-ink);
  }

  /* B4 - My Results supporting lines. Best score is the answer the student
     came for; attempt count is secondary context. Both drop the auth-card
     paragraph centering/margins inside the card. */
  body:not(:has(#app-root > .shell-header)) [data-testid=results-best-score] {
    margin: 0;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--tw-ink-soft);
  }
  body:not(:has(#app-root > .shell-header)) [data-testid=results-attempt-count] {
    margin: 0;
    font-size: 0.82rem;
    color: var(--tw-ink-muted);
  }

  /* B4 - Status chip. A restrained pill. Status is still carried by the
     visible text label + glyph (the glyph is aria-hidden), never by color
     alone. Tones are muted and drawn from existing badge/callout tokens - not
     a bright status rainbow: an inviting teal for Ready to Begin, neutral for
     Improving, and one soft-success family for the two done states (which the
     ● / ★ glyph and "Well Done!" / "Perfect Score" text distinguish). */
  body:not(:has(#app-root > .shell-header)) .student-status {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.2rem 0.6rem;
    border-radius: var(--tw-radius-pill);
    font-size: 0.8rem;
    font-weight: 600;
    line-height: 1.2;
    background: var(--tw-badge-neutral-bg);
    color: var(--tw-ink-soft);
    border: 1px solid transparent;
  }
  body:not(:has(#app-root > .shell-header)) .student-status[data-status=ready] {
    background: var(--tw-nav-wash);
    color: var(--tw-nav-edge);
    border-color: var(--tw-toggle-active-edge);
  }
  body:not(:has(#app-root > .shell-header)) .student-status[data-status=improving] {
    background: var(--tw-badge-neutral-bg);
    color: var(--tw-ink-soft);
  }
  body:not(:has(#app-root > .shell-header)) .student-status[data-status=wellDone],
  body:not(:has(#app-root > .shell-header)) .student-status[data-status=perfect] {
    background: var(--tw-callout-success-bg);
    color: var(--tw-callout-success-ink);
    border-color: var(--tw-callout-success-edge);
  }

  /* B1 - Primary action. Open assignment / Improve My Score were raw OS
     buttons while only the rare error-recovery button was styled, which
     inverted the hierarchy. Give the everyday action the LyfeLabz primary
     treatment (filled green pill, 44px touch target, visible focus ring) sized
     for a card rather than the full-width page hero. Labels, testids, launch
     URLs, and click behavior are unchanged. */
  body:not(:has(#app-root > .shell-header)) [data-testid=assignments-launch],
  body:not(:has(#app-root > .shell-header)) [data-testid=results-improve] {
    align-self: flex-start;
    margin: 0.15rem 0 0;
    padding: 0.55rem 1.1rem;
    background: var(--tw-primary);
    color: #fff;
    border: 1px solid var(--tw-primary);
    border-radius: var(--tw-radius-control);
    font-weight: 600;
    cursor: pointer;
    min-height: 44px;
    box-shadow: 0 1px 2px rgba(23, 90, 49, 0.22);
    transition: background 0.15s ease, border-color 0.15s ease,
                box-shadow 0.15s ease;
  }
  body:not(:has(#app-root > .shell-header)) [data-testid=assignments-launch]:hover:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=assignments-launch]:focus-visible:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=results-improve]:hover:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=results-improve]:focus-visible:not(:disabled) {
    background: var(--tw-primary-strong);
    border-color: var(--tw-primary-strong);
    outline: none;
    box-shadow: 0 0 0 3px rgba(31, 107, 61, 0.28);
  }

  /* B4 - Quiet completed work (My Assignments only). A card whose best score
     already reads Well Done! or Perfect Score recedes so the eye lands on
     unfinished work first. Presentation only: the card stays visible, the
     title and status stay readable (no color-only signal, no
     accessibility-eroding opacity fade), and the Open assignment control stays
     present and operable - it simply drops to a quieter secondary (outline)
     treatment. Completion is also carried by the status chip's text + glyph,
     so it is never signaled by the quieting alone. */
  body:not(:has(#app-root > .shell-header)) [data-testid=assignments-item][data-complete=true] {
    background: var(--tw-surface-alt);
    box-shadow: none;
  }
  body:not(:has(#app-root > .shell-header)) [data-testid=assignments-item][data-complete=true] [data-testid=assignments-item-title] {
    color: var(--tw-ink-soft);
  }
  body:not(:has(#app-root > .shell-header)) [data-testid=assignments-item][data-complete=true] [data-testid=assignments-launch] {
    background: transparent;
    color: var(--tw-nav-edge);
    border-color: var(--tw-nav-edge);
    box-shadow: none;
  }
  body:not(:has(#app-root > .shell-header)) [data-testid=assignments-item][data-complete=true] [data-testid=assignments-launch]:hover:not(:disabled),
  body:not(:has(#app-root > .shell-header)) [data-testid=assignments-item][data-complete=true] [data-testid=assignments-launch]:focus-visible:not(:disabled) {
    background: var(--tw-nav-wash);
    color: var(--tw-nav-edge);
    border-color: var(--tw-nav-edge);
    box-shadow: 0 0 0 3px rgba(26, 95, 111, 0.20);
  }

  @media (max-width: 480px) {
    body:not(:has(#app-root > .shell-header)) #app-root {
      padding: 1.75rem 1.25rem 1.5rem;
      margin: 1rem;
      border-radius: 8px;
    }
    .auth-brand { font-size: 1.4rem; }
    /* Tabs split the row evenly so they never wrap on a narrow phone. */
    body:not(:has(#app-root > .shell-header)) [data-testid=student-nav] {
      gap: 0;
    }
    body:not(:has(#app-root > .shell-header)) [data-testid=student-nav] [role=tab] {
      flex: 1 1 0;
      text-align: center;
      padding: 0.55rem 0.5rem;
    }
    /* Full-width card actions for a comfortable tap target. */
    body:not(:has(#app-root > .shell-header)) [data-testid=assignments-launch],
    body:not(:has(#app-root > .shell-header)) [data-testid=results-improve] {
      align-self: stretch;
      text-align: center;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    body:not(:has(#app-root > .shell-header)) [data-testid=google-signin],
    body:not(:has(#app-root > .shell-header)) [data-testid=request-verification],
    body:not(:has(#app-root > .shell-header)) [data-testid=join-class] {
      transition: none !important;
    }
  }
</style>
</head>
