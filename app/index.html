<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LyfeLabz Platform</title>
<!-- Sprint 20 (Visual Identity Refinement): load Orbitron so the
     Teacher Workspace can reuse the canonical LYFELABZ wordmark
     typography already used across the public LyfeLabz experience.
     No new font families are introduced elsewhere in the shell. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.5;
  }
  #app-root { text-align: center; padding: 1.5rem; max-width: 40rem; }
  h1 { font-size: 1.5rem; font-weight: 500; margin: 0 0 0.5rem 0; }
  p { margin: 0.25rem 0; }
  button { margin-top: 1rem; padding: 0.5rem 1rem; font: inherit; cursor: pointer; }
  [role="alert"] { color: #a00; }
</style>
<style id="shell-canonical">
  /* Teacher Platform Shell layout tokens. Reuses inherited typography;
     introduces no new design system. See SPRINT_3_STEP_5_SPECIFICATION.md. */
  #app-root:has(> .shell-header) {
    display: block;
    text-align: left;
    padding: 0;
    max-width: none;
    width: 100%;
    align-self: stretch;
  }
  body:has(#app-root > .shell-header) {
    display: block;
    align-items: initial;
    justify-content: initial;
  }
  .shell-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    /* Vertical padding mirrors the canonical public homepage nav
       (index.html .nav = padding: 0.85rem 2.5rem @ html font-size:18px,
       i.e. 15.3px block padding). No fixed height so header thickness
       is driven by wordmark line-box + padding, exactly like the
       public site. Horizontal padding preserves the workspace
       chrome's tighter left/right rhythm. */
    padding: 15.3px 1.25rem;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    background: #fff;
    box-sizing: border-box;
  }
  .shell-brand {
    margin: 0;
    flex: 0 0 auto;
  }
  .shell-header-identity {
    flex: 1 1 auto;
    text-align: right;
    font-size: 0.95rem;
    color: #444;
    min-width: 0;
  }
  .shell-header-name {
    display: inline-block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: bottom;
  }
  .shell-notifications {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    color: #b8b8b8;
    font-size: 1.15rem;
    line-height: 1;
    flex: 0 0 auto;
    user-select: none;
  }
  .shell-signout {
    margin: 0;
    padding: 0.4rem 0.9rem;
    background: transparent;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
    flex: 0 0 auto;
    min-height: 36px;
  }
  .shell-signout:hover, .shell-signout:focus-visible {
    border-color: #666;
  }
  .shell-body {
    display: grid;
    grid-template-columns: 224px 1fr;
    max-width: 1760px;
    margin: 0 auto;
    padding: 1.25rem 1.5rem 1.25rem 1rem;
    gap: 2.75rem;
    box-sizing: border-box;
  }
  @media (min-width: 1280px) {
    .shell-body {
      padding-left: 1.25rem;
      padding-right: 2.25rem;
      gap: 3.25rem;
    }
  }
  @media (min-width: 1600px) {
    .shell-body {
      padding-left: 1.5rem;
      padding-right: 2.5rem;
      gap: 3.75rem;
    }
  }
  .shell-nav-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .shell-nav-button {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    width: 100%;
    text-align: left;
    padding: 0.55rem 0.75rem;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    font: inherit;
    margin: 0;
    min-height: 40px;
    box-sizing: border-box;
  }
  .shell-nav-brand {
    display: block;
  }
  .shell-nav-active {
    background: #f4f4f4;
    font-weight: 600;
    cursor: default;
  }
  .shell-nav-brand {
    font-weight: 700;
    letter-spacing: 0.06em;
    color: #222;
    padding-top: 1.1rem;
    padding-bottom: 1.1rem;
    margin-bottom: 0.75rem;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 0;
    background: transparent;
  }
  .shell-nav-icon {
    flex: 0 0 auto;
    display: inline-block;
    vertical-align: middle;
    opacity: 0.85;
  }
  .shell-nav-label {
    display: inline-block;
    vertical-align: middle;
  }
  .shell-nav-brand.shell-nav-active {
    background: transparent;
  }
  .shell-nav-disabled {
    color: #8a8a8a;
    cursor: not-allowed;
  }
  .shell-nav-disabled:hover, .shell-nav-disabled:focus { color: #8a8a8a; }
  .shell-main {
    display: block;
    min-width: 0;
  }
  .shell-welcome {
    font-size: 1.5rem;
    font-weight: 500;
    margin: 0 0 0.5rem 0;
    outline: none;
  }
  .shell-welcome:focus-visible { outline: 2px solid #444; outline-offset: 2px; }
  .shell-status {
    color: #555;
    margin: 0 0 1.25rem 0;
  }
  .shell-card {
    background: #fff;
    border: 1px solid rgba(0, 0, 0, 0.09);
    border-radius: 6px;
    padding: 1rem 1.15rem;
    margin: 0 0 1rem 0;
  }
  .shell-identity-list {
    display: grid;
    grid-template-columns: minmax(120px, auto) 1fr;
    gap: 0.35rem 1rem;
    margin: 0;
  }
  .shell-identity-row {
    display: contents;
  }
  .shell-identity-row dt {
    font-weight: 600;
    color: #333;
    margin: 0;
  }
  .shell-identity-row dd {
    margin: 0;
    color: #222;
    word-break: break-word;
  }
  .shell-pill {
    display: inline-block;
    padding: 0.1rem 0.55rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .shell-pill-verified {
    background: rgba(207, 168, 60, 0.18);
    color: #8a6d15;
    border: 1px solid rgba(138, 109, 21, 0.25);
  }
  .shell-placeholder-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin: 0.5rem 0 1.5rem 0;
  }
  .shell-placeholder-card {
    background: #fafafa;
    color: #666;
    cursor: not-allowed;
  }
  .shell-placeholder-card:hover, .shell-placeholder-card:focus { background: #fafafa; }
  .shell-placeholder-title {
    font-size: 1rem;
    margin: 0 0 0.35rem 0;
    color: #333;
  }
  .shell-placeholder-purpose { margin: 0 0 0.5rem 0; }
  .shell-placeholder-status { margin: 0; font-size: 0.9rem; }
  .shell-return-link {
    display: inline-block;
    margin-top: 0.75rem;
    font-size: 0.9rem;
    color: #555;
  }
  /* Curriculum landing (Sprint 6D). Reuses the shell card language and
     introduces teacher-only activation controls. Placeholder-only:
     activation state is client-local per mount. */
  .shell-curriculum-intro {
    max-width: 46rem;
  }
  .shell-curriculum-controls {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin: 0 0 1rem 0;
  }
  .shell-filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }
  .shell-filter-pill {
    padding: 0.35rem 0.75rem;
    background: #fff;
    border: 1px solid rgba(0, 0, 0, 0.15);
    border-radius: 999px;
    font: inherit;
    font-size: 0.9rem;
    color: #333;
    cursor: pointer;
    min-height: 32px;
  }
  .shell-filter-pill:hover, .shell-filter-pill:focus-visible {
    border-color: #666;
  }
  .shell-filter-pill-active {
    background: #eef1f5;
    border-color: #666;
    font-weight: 600;
  }
  /* Sprint 28.6H (Finding 6): the Curriculum grid uses an explicit column
     count per breakpoint rather than auto-fill, so wide desktops show 4 cards
     across (not 5) and the card has room for its full contents (grade, domain,
     title, Assign/Preview, View Summary, Resources) without wrapping or
     clipping. minmax(0, 1fr) lets each column shrink to fit with no horizontal
     page scroll. Card readability > maximum density. Responsive counts are set
     in the media block below (3 / 2 / 1). */
  .shell-curriculum-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    /* Sprint 20 polish: horizontal gap preserved; vertical gap tightened
       (~35%) so the grid reads as one continuous curriculum library. */
    column-gap: 0.85rem;
    row-gap: 0.55rem;
    margin: 0.75rem 0 1.25rem 0;
    min-width: 0;
  }
  .shell-lesson-card {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    padding: 0.5rem 0.8rem 0.5rem 0.8rem;
    /* Sprint 20 polish: override the inherited .shell-card
       margin-bottom that stacked with the grid row-gap and inflated
       row spacing. Card height is now driven only by content + the
       grid's own row track. */
    margin: 0;
    transition: opacity 0.15s ease-in-out;
    box-sizing: border-box;
    min-width: 0;
    overflow: hidden;
    /* Sprint 20 UI polish, Curriculum uniform-height fix.
       Enforce a single deliberate card height across the entire grid,
       not just within a row. CSS Grid alone equalizes track heights
       per row; this min-height carries the same height across every
       row so the Curriculum reads as one uniform library. The value
       is the smallest comfortable height that fits the canonical
       card contents: header pills row + reserved two-line title
       region + action row, plus current internal spacing.
       Sprint 28.6H.3 (Task D6): View Summary and Resources merged into one
       quiet footer row (no longer two stacked blocks), so the card needs less
       reserved height. Sprint 28.6H.4 (Task D3/D6): the surrounding dead space
       (title/action/footer margins) was trimmed, so the reserved floor drops
       again to 6.5rem for a materially shorter, scannable card that keeps
       comfortable 44px touch targets. The effective floor is set once in the
       responsive block below. */
    min-height: 6.5rem;
  }
  .shell-lesson-card[hidden] { display: none; }
  /* Sprint 28.6H.6 (Task C2): a lesson that has already been assigned gets a
     VERY subtle cool blue/slate tint so the teacher can scan which lessons have
     been used. This is a DIFFERENT concept from the Classes completed state
     (pale green) and deliberately uses a cool hue, never green. It stays far
     quieter than the green Assign button and never fires on a deactivated card
     (`:not(.shell-lesson-card-inactive)`), which keeps its own gray treatment.
     The tint is supplemental only; Assign/Preview/View Summary/Resources and
     every badge are unchanged. */
  .shell-lesson-card-assigned:not(.shell-lesson-card-inactive) {
    background: rgba(90, 120, 160, 0.08);
    border-color: rgba(70, 100, 140, 0.22);
  }
  .shell-lesson-card-inactive {
    background: #f6f6f6;
    opacity: 0.72;
  }
  .shell-lesson-header {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    align-items: center;
  }
  .shell-lesson-badge {
    display: inline-block;
    padding: 0.1rem 0.55rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    line-height: 1.4;
    background: #eef1f5;
    color: #444;
    border: 1px solid rgba(0, 0, 0, 0.08);
  }
  .shell-lesson-topic-life-science       { background: rgba(61,220,132,0.14);  color: #1f6b3d; }
  .shell-lesson-topic-earth-space        { background: rgba(180,127,255,0.14); color: #5b3a99; }
  .shell-lesson-topic-physical-science   { background: rgba(255,112,67,0.14);  color: #a24218; }
  .shell-lesson-topic-tech-engineering   { background: rgba(245,200,66,0.18);  color: #7a5b0a; }
  .shell-lesson-title {
    font-size: 1.02rem;
    font-weight: 600;
    color: #222;
    margin: 0;
  }
  .shell-lesson-card-inactive .shell-lesson-title { color: #555; }
  .shell-lesson-title-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.35rem 0.6rem;
    min-width: 0;
    /* Sprint 20 final structural pass: separate the Grade / Topic metadata
       pills from the lesson title so the title reads as a distinct
       hierarchical level. Sprint 28.6H.4 (Task D3): trimmed 0.4rem -> 0.25rem
       to recover card vertical space while keeping the hierarchy readable. */
    margin-top: 0.25rem;
  }
  .shell-lesson-title-row .shell-lesson-title {
    flex: 1 1 auto;
    min-width: 0;
    overflow-wrap: anywhere;
    /* Sprint 20 UI polish, Curriculum uniform-height fix.
       Reserve exactly two lines of title height on every card so a
       one-line title no longer collapses its grid row and a two-line
       title no longer stretches its neighbors. One-line titles remain
       top-aligned (no vertical centering) because the block simply
       fills its reserved space from the top. Titles that would exceed
       two lines are visually clamped; the full stored title stays in
       the DOM node and remains available to assistive tech via the
       element's own textContent / accessible name. Reserved height is
       expressed in em so it tracks the title's own line-height (1.3)
       regardless of the exact font-size chosen upstream. */
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    overflow: hidden;
    min-height: 2.6em;
  }
  /* Sprint 28.6H.2 (Finding 2): the lesson-card action area is a VERTICAL
     stack, not a single wrapping row. The Assign/Preview pair is its own row
     (`.shell-lesson-action-pair`) so the two primary controls are sized only
     against each other and keep identical geometry on every card. The
     conditional View Summary and the Inactive toggle are separate rows that
     can never enter the pair's width calculation. This replaces the earlier
     single-row `flex-wrap` approach, whose `flex-basis:100%` on View Summary
     did NOT force a wrap: because Assign/Preview use `flex-basis:0`, all three
     items fit on one line (0 + 0 + 100% = 100%), so View Summary sat in the
     same row and crushed Assign/Preview narrow. */
  .shell-lesson-actions {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0.35rem;
    /* Sprint 28.6D.1 (Task 1) / 28.6H.4 (Task D3): tighten the gap between the
       lesson title and the primary actions so lesson identity and
       Assign/Preview read as one connected unit and the card runs shorter. */
    margin-top: 0.25rem;
    min-width: 0;
  }
  .shell-lesson-actions > * {
    min-width: 0;
  }
  /* Sprint 28.6H.4 (Task D1/D2): the paired primary row holds exactly two
     children - Assign and Preview. It is a plain flex row that shrink-wraps to
     its content (`align-self: flex-start`), so the pair sits at the LEFT of the
     card and does NOT stretch across the full card width. Equal geometry is NOT
     delegated to a grid track algorithm (an intrinsic `inline-grid` with
     `grid-auto-columns: 1fr` did NOT equalize its columns under shrink-to-fit
     sizing, which is why the live cards showed mismatched widths); instead each
     control carries an explicit identical fixed width + height below. The pair
     wraps on an extremely narrow card rather than forcing horizontal scroll. */
  .shell-lesson-action-pair {
    display: flex;
    flex-wrap: nowrap;
    align-items: stretch;
    /* Bounded to the card width (align-self: stretch inherits the actions
       column's align-items: stretch) so the two controls SHRINK equally to fit
       a narrow 4-column card instead of wrapping to a second line. Buttons are
       left-aligned within that width (they never grow to fill it). */
    justify-content: flex-start;
    gap: 0.5rem;
    min-width: 0;
  }
  /* Sprint 28.6H.4 (Task D1): Assign and Preview resolve to the EXACT same
     width and height from this ONE shared rule. The fixed width means label
     length ("Assign" vs "Preview") can never size them differently. `flex: 0 1
     auto` forbids GROWING (they never stretch into page-level CTAs, Task J
     #15) but permits equal SHRINK: at the accepted 4-column desktop density a
     card is only ~165-200px wide, so a rigid 112px pair would wrap; instead the
     two controls shrink together, staying IDENTICAL and on one line. 7rem =
     112px is the roomy-card cap (within the 110-125px contract); 2.75rem = 44px
     is the fixed height (within 42-46px, meeting the 44px touch target).
     box-sizing keeps padding/border inside the fixed box. */
  .shell-lesson-assign,
  .shell-lesson-preview {
    box-sizing: border-box;
    width: 7rem;
    height: 2.75rem;
    flex: 0 1 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-width: 0;
    /* Zero the global button's 1rem top-margin (which applied to the
       Assign <button> but not the Preview <a>, shifting Assign 16px lower and
       inflating the pair). Both controls now share identical box geometry. */
    margin: 0;
  }
  /* The Inactive toggle is its own row; keep it sized to its content rather
     than stretching across the full column width. */
  .shell-lesson-actions > .shell-lesson-toggle {
    align-self: flex-start;
  }
  /* Sprint 28.6H.3 (Task D3/D6): the shared quiet footer for the two secondary
     lesson-inspection actions. View Summary sits at the left; the Resources
     disclosure is pushed to the right (`margin-left:auto`) so a Resources-only
     card reads `                1 Resource ›` while a View-Summary-only card
     reads `View Summary` at the left. The hairline boundary + top padding are
     applied only when the row actually contains a VISIBLE control (`:has`), so
     a card whose sole footer member is a hidden (never-assigned) View Summary
     shows no empty footer and no stray rule. Wraps on very narrow cards. */
  .shell-lesson-footer-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem 0.6rem;
    min-width: 0;
  }
  .shell-lesson-footer-row > .shell-lesson-resources-toggle {
    margin-left: auto;
  }
  .shell-lesson-footer:has(.shell-lesson-footer-row > *:not([hidden])) .shell-lesson-footer-row {
    /* Sprint 28.6H.4 (Task D3/D5): restrained footer separation (0.4rem ->
       0.3rem) so the quiet View Summary / Resources footer consumes less
       vertical space. */
    margin-top: 0.3rem;
    padding-top: 0.3rem;
    border-top: 1px solid var(--tw-hairline-soft, rgba(28, 39, 51, 0.06));
  }
  .shell-lesson-toggle {
    padding: 0.25rem 0.6rem;
    background: #fff;
    border: 1px solid rgba(0, 0, 0, 0.18);
    border-radius: 999px;
    font: inherit;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    cursor: pointer;
    min-height: 28px;
  }
  .shell-lesson-toggle[hidden] { display: none; }
  .shell-lesson-toggle-active {
    background: rgba(61, 140, 89, 0.12);
    border-color: rgba(61, 140, 89, 0.45);
    color: #1f6b3d;
  }
  .shell-lesson-toggle-inactive {
    background: rgba(162, 66, 24, 0.10);
    border-color: rgba(162, 66, 24, 0.35);
    color: #a24218;
  }
  .shell-lesson-toggle:hover, .shell-lesson-toggle:focus-visible {
    border-color: #333;
  }
  .shell-curriculum-empty {
    color: #666;
    margin: 0.25rem 0 1rem 0;
  }
  @media (pointer: coarse) {
    .shell-filter-pill { min-height: 44px; }
    .shell-lesson-toggle { min-height: 32px; }
  }
  /* Sprint 28.6H.2: no phone-width override is needed. The action area is a
     vertical stack at every width, and the Assign/Preview pair keeps its two
     equal children side by side (both short labels), so the paired geometry
     holds on phones without re-introducing a rule that could resize View
     Summary. */
  .shell-footer {
    text-align: center;
    padding: 1rem;
    color: #888;
    font-size: 0.85rem;
    border-top: 1px solid rgba(0, 0, 0, 0.06);
    margin-top: 1.5rem;
  }
  @media (max-width: 960px) {
    .shell-placeholder-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 720px) {
    .shell-body { grid-template-columns: 1fr; padding: 1rem; gap: 1rem; }
    .shell-nav-list { flex-direction: row; overflow-x: auto; }
    .shell-nav-button { min-width: 140px; }
    .shell-placeholder-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) {
    /* Compact horizontal chrome on phones. Vertical padding + wordmark
       size are preserved at canonical values so the brand mark reads
       identically to the public homepage across every viewport. */
    .shell-header { padding: 15.3px 0.75rem; gap: 0.5rem; }
    .shell-header-identity { display: none; }
  }
  @media (pointer: coarse) {
    .shell-nav-button, .shell-signout { min-height: 44px; }
    .shell-notifications { width: 44px; height: 44px; }
  }
  @media (orientation: landscape) and (max-width: 950px) {
    .shell-body { padding-left: max(1rem, env(safe-area-inset-left)); padding-right: max(1rem, env(safe-area-inset-right)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .shell-main, .shell-card { transition: none !important; animation: none !important; }
  }
  /* Sprint 28.6F: simplified Settings surface. A single Classes & Google
     Classroom administrative section: connection status, Import (primary),
     Create (secondary). Reuses the shell button language; introduces no new
     design system. Connection management still opens the Integrations
     surface below. */
  .shell-settings-intro {
    margin: 0.25rem 0 1rem 0;
  }
  /* Sprint 28.6H.4 (Task E1): Settings is a scalable tabbed surface. The tab
     row is a quiet segmented control; only real categories render (one tab -
     Class Management - today). The selected tab carries a solid underline
     accent (non-color state also on aria-selected). */
  .shell-settings-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin: 0 0 1.25rem 0;
    border-bottom: 1px solid var(--tw-hairline-soft, rgba(28, 39, 51, 0.1));
  }
  .shell-settings-tab {
    padding: 0.5rem 0.85rem;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    /* margin-top: 0 zeroes the global button's 1rem top-margin. */
    margin-top: 0;
    margin-bottom: -1px;
    font: inherit;
    font-weight: 600;
    color: var(--tw-ink-muted, #566472);
    cursor: pointer;
  }
  .shell-settings-tab[aria-selected="true"] {
    color: var(--tw-ink, #1c2733);
    border-bottom-color: #1f6b3d;
  }
  .shell-settings-tab:focus-visible {
    outline: none;
    box-shadow: var(--tw-focus-ring, 0 0 0 3px rgba(26, 95, 111, 0.22));
    border-radius: 4px;
  }
  .shell-settings-panel {
    display: block;
  }
  /* Sprint 28.6H.4 (Task E2/E7): the Class Management panel. The Google

  /* Assign Experience (Sprint 6E, remediated Sprint 20).
     The Curriculum surface builds a modal overlay for the Assign action
     entirely in JS with the classes below. Without these rules the
     overlay renders as an unpositioned block at the end of <body>, so
     clicking Assign appears to do nothing. Canonical LyfeLabz shell
     tokens; no new design system. */
  .shell-lesson-assign {
    /* Sprint 28.6H.4 (Task D1): sizing (width/height/box) is owned by the
       shared `.shell-lesson-assign, .shell-lesson-preview` rule above; this
       rule carries only the primary-green presentation. */
    padding: 0 0.5rem;
    font: inherit;
    background: #1f6b3d;
    color: #fff;
    border: 1px solid #1f6b3d;
    border-radius: 4px;
    cursor: pointer;
  }
  .shell-lesson-assign:hover, .shell-lesson-assign:focus-visible {
    background: #175a31;
    border-color: #175a31;
  }
  /* Sprint 28.6H.8 (Part B): a previously assigned lesson reads "Reassign" as a
     green-OUTLINE action - transparent fill (the assigned card's slate tint
     shows through), assignment-green border + text - so unused lessons
     (full-strength solid green "Assign") clearly come forward while previously
     used lessons stay easy to reassign. Green text #1f6b3d on the pale
     slate/white card is high-contrast (>6:1, AA); the outlined green keeps it
     in the assignment family (distinct from the neutral gray Preview) and never
     reads as disabled/gray. Hover adds a very light green wash; the focus ring
     is re-asserted so focus stays visible (Part K). The two-class selector wins
     over the base solid-green + polish rules regardless of source order. */
  .shell-lesson-assign.shell-lesson-reassign {
    background: transparent;
    color: #1f6b3d;
    border-color: #1f6b3d;
    box-shadow: none;
  }
  .shell-lesson-assign.shell-lesson-reassign:hover,
  .shell-lesson-assign.shell-lesson-reassign:focus-visible {
    background: rgba(31, 107, 61, 0.08);
    border-color: #175a31;
    color: #175a31;
  }
  .shell-lesson-assign.shell-lesson-reassign:focus-visible {
    box-shadow: var(--tw-focus-ring, 0 0 0 3px rgba(26, 95, 111, 0.22));
  }
  /* Sprint 28.6H (Finding 8): the "✓ Assigned" badge and its
     .shell-lesson-assign-assigned styling were removed; Assign always reads
     "Assign" and stays the primary green control. */
  /* Sprint 28.6H (Finding 9): lesson-level View Summary is a QUIETER
     analytical action than Assign/Preview - a restrained, borderless
     text-style control (no box), so it never competes with the primary
     paired buttons or crushes into a two-line box. It stays a real,
     keyboard-focusable button with a visible focus ring; the gold accent
     lives in the text + underline. white-space:nowrap keeps the label on one
     line. Hidden (no dead control) until the lesson has owned
     published/closed assignment history. */
  .shell-lesson-view-summary {
    padding: 0.2rem 0;
    /* margin: 0 zeroes the global button 1rem top-margin that otherwise adds
       16px above this footer control (Sprint 28.6H.4, Task D3/D5). */
    margin: 0;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    background: transparent;
    color: var(--tw-ink-soft, #3a4653);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    min-height: 28px;
    text-decoration: underline;
    text-decoration-color: var(--tw-gold-border, rgba(214, 158, 23, 0.55));
    text-underline-offset: 2px;
  }
  .shell-lesson-view-summary:hover,
  .shell-lesson-view-summary:focus-visible {
    color: var(--tw-gold-strong, #a9790f);
    text-decoration-color: var(--tw-gold-strong, #a9790f);
  }
  .shell-lesson-view-summary:focus-visible {
    outline: none;
    box-shadow: var(--tw-focus-ring, 0 0 0 3px rgba(26, 95, 111, 0.22));
  }
  .shell-lesson-view-summary[hidden] { display: none; }
  /* Sprint 28.6D: teacher-safe Preview (quieter, neutral action) and the
     formal Resources disclosure. Canonical shell tokens; no new design
     system. */
  .shell-lesson-preview {
    /* Sprint 28.6H.4 (Task D1): sizing (width/height/box/centering) is owned by
       the shared `.shell-lesson-assign, .shell-lesson-preview` rule above; this
       rule carries only the quiet, neutral/outlined presentation. */
    padding: 0 0.5rem;
    font: inherit;
    background: transparent;
    color: #333;
    border: 1px solid rgba(0, 0, 0, 0.18);
    border-radius: 4px;
    cursor: pointer;
    text-decoration: none;
  }
  .shell-lesson-preview:hover,
  .shell-lesson-preview:focus-visible {
    border-color: #333;
    background: rgba(0, 0, 0, 0.04);
  }
  /* Sprint 28.6H.3 (Task D5): Resources read as a quiet disclosure inside the
     shared card footer (see `.shell-lesson-footer-row`), not a third primary
     action. The footer boundary + spacing now live on the footer row; the
     disclosure itself is a borderless text row with a rotating caret glyph, and
     each resource is a compact type-eyebrow + title with a quiet secondary Open
     action (28.6D.1, unchanged). */
  .shell-lesson-resources-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    /* margin: 0 zeroes the global button's 1rem top-margin (Sprint
       28.6H.4, Task D3/D5). */
    margin: 0;
    padding: 0.15rem 0;
    font: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    background: transparent;
    color: var(--tw-ink-soft, #3a4653);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    min-height: 28px;
  }
  /* Disclosure caret: a single right chevron that rotates to point down
     when expanded. State is carried by shape + aria-expanded, never by
     color; no icon library is introduced. */
  .shell-lesson-resources-toggle::after {
    content: "\203A";
    font-size: 1rem;
    line-height: 1;
    color: var(--tw-ink-muted, #566472);
    transition: transform 0.15s ease;
  }
  .shell-lesson-resources-toggle[aria-expanded="true"]::after {
    transform: rotate(90deg);
  }
  .shell-lesson-resources-toggle:hover,
  .shell-lesson-resources-toggle:focus-visible {
    color: var(--tw-ink, #1c2733);
  }
  .shell-lesson-resources-toggle:focus-visible {
    outline: none;
    box-shadow: var(--tw-focus-ring, 0 0 0 3px rgba(26, 95, 111, 0.22));
  }
  .shell-lesson-resources-panel[hidden] { display: none; }
  .shell-lesson-resources-list {
    list-style: none;

    flex-direction: column;
    gap: 0.5rem;

  /* Sprint 28.6H.5 (Task C1/C2): the resource Open action is a compact OUTLINED
     control (not bare green text, not a solid primary button). Fixed 4.75rem
     (76px) x 2.375rem (38px) - within the 70-85 / 36-40 contract, consistent
     for every resource row, and clearly SMALLER than Assign/Preview (7rem x
     2.75rem) so it reads as a tertiary action. Navigation (href, new tab,

  .shell-lesson-resource-open {

    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 4.75rem;
    height: 2.375rem;
    /* Zero the global button/anchor top-margin reset is unnecessary (this is an
       <a>), but keep margin explicit for stable geometry. */
    margin: 0;
    color: #175a31;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.85rem;
    border: 1px solid rgba(23, 90, 49, 0.35);
    border-radius: 4px;
    background: transparent;
  }
  .shell-lesson-resource-open:hover,
  .shell-lesson-resource-open:focus-visible {
    border-color: #175a31;
    background: rgba(23, 90, 49, 0.06);
    text-decoration: none;
  }
  .shell-lesson-resource-open:focus-visible {
    outline: none;
    box-shadow: var(--tw-focus-ring, 0 0 0 3px rgba(26, 95, 111, 0.22));

  /* Sprint 28.6E: lesson-level View Summary surface. Rendered into the
     Curriculum outlet (the shell header/nav/footer stay mounted, so

  .shell-curriculum-summary-host:empty { display: none; }

  .shell-lesson-summary-error {

  .shell-lesson-summary-retry {
